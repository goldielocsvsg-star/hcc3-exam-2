ergency-to-action connections supported by the HCC3 cancer materials. SELECT ALL THAT APPLY.","choices":["Thiazide diuretics are the preferred course treatment for hypercalcemia.","TLS management includes aggressive hydration, electrolyte/renal/cardiac monitoring, and uric-acid therapy.","Constipation, polyuria, dehydration, weakness, and altered cognition suggest hypercalcemia.","Fluid restriction is the priority for hypercalcemia.","High-dose IV corticosteroids are a course-supported early treatment for spinal cord compression.","TLS produces low potassium as its hallmark."],"correct":[1,2,4],"exactCount":null,"topics":["Oncologic Emergencies"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"The correct selections are the course-supported statements for Oncologic Emergencies. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary."],"id":125},{"type":"identify","stem":"A 68-year-old has a fixed breast mass, nipple retraction, peau d’orange, and enlarged axillary nodes. Which condition is most consistent with the full pattern?","choices":["BPH","Colorectal cancer","Breast cancer","ALL"],"correct":2,"topics":["Breast Cancer/Mastectomy"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"EVIDENCE: fixed breast mass + nipple/skin change + nodal findings. INTERPRETATION: the cluster localizes to breast tissue and suggests malignant involvement rather than a benign localized process. CONDITION: breast cancer.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Breast Cancer/Mastectomy; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Breast Cancer/Mastectomy; it either addresses a different problem or would delay the needed response.","Best answer: EVIDENCE: fixed breast mass + nipple/skin change + nodal findings. INTERPRETATION: the cluster localizes to breast tissue and suggests malignant involvement rather than a benign localized process. CONDITION: breast cancer.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Breast Cancer/Mastectomy; it either addresses a different problem or would delay the needed response."],"id":126},{"type":"bowtie","stem":"A client with metastatic cancer reports a change in symptoms. Choose the 2 MOST IMPORTANT cues, 1 most likely complication, and 2 PRIORITY nursing actions.","cues":["Progressive thoracic back pain","New leg weakness/tingling with urinary retention","Mild alopecia","Controlled nausea","Stable JP output"],"correctCues":[0,1],"conditions":["Spinal cord compression","SVC syndrome","Mucositis","BPH"],"correctCondition":0,"actions":["Escalate immediately for neurologic emergency","Anticipate urgent MRI and high-dose IV corticosteroids","Schedule routine follow-up next month","Encourage vigorous unassisted walking","Begin radiation-site lotion"],"correctActions":[0,1],"topics":["Oncologic Emergencies","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"KEY CLUE: progressive back pain plus new motor/sensory and bladder changes. ANALYZE: this pattern threatens spinal cord function. PRIORITY: prevent permanent neurologic damage. TAKE ACTION: urgent escalation, MRI, and high-dose corticosteroid treatment. TRAP: treating this as routine cancer pain risks paralysis.","id":127},{"type":"mcq","stem":"A neutropenic client 8 days after chemotherapy has a temperature of 100.4°F (38°C) and no obvious redness or pus. What should the nurse do FIRST?","choices":["Give an IM injection for fever control.","Reassure the client that absence of pus rules out infection.","Report the fever immediately and initiate the infection/neutropenic protocol.","Recheck the temperature at the next routine vital-sign time."],"correct":2,"topics":["Neutropenia","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"Neutropenic infection may produce muted inflammatory signs; a temperature at the course threshold may be the only clue and requires immediate escalation.","notes":["Why not: unnecessary IM injections increase bleeding/injury risk and are avoided when platelets are suppressed.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Neutropenia; it either addresses a different problem or would delay the needed response.","Best answer: Neutropenic infection may produce muted inflammatory signs; a temperature at the course threshold may be the only clue and requires immediate escalation.","Why not: this delays care despite a course-identified urgent cue; the item requires earlier assessment/escalation or treatment."],"id":128},{"type":"mcq","stem":"A client with ALL has platelets of 9,000/mm³. Which action is most appropriate?","choices":["Give aspirin for bone pain.","Report the critical value and prepare for platelet transfusion while maintaining bleeding precautions.","Encourage contact sports to preserve conditioning.","Use rectal suppositories for constipation."],"correct":1,"topics":["Thrombocytopenia"],"paint":"Interventions/Take Action","priority":false,"teaching":false,"core":"The ALL concept map specifically says to report platelets below 10,000/mm³ and prepare for platelet transfusion.","notes":["Why not: aspirin is specifically avoided with thrombocytopenia/bleeding risk unless prescribed, and the ALL aspiration teaching uses aspirin-free analgesia.","Best answer: The ALL concept map specifically says to report platelets below 10,000/mm³ and prepare for platelet transfusion.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Thrombocytopenia; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Thrombocytopenia; it either addresses a different problem or would delay the needed response."],"id":129},{"type":"case","stem":"Four oncology clients need assessment. Client A has controlled mucositis and asks for saline rinse. Client B has a new purple colostomy. Client C has lung cancer with facial swelling and new stridor. Client D is after TURP with small clots but good catheter output. Which client should the nurse assess FIRST?","choices":["Client C with facial swelling and new stridor.","Client A with controlled mucositis.","Client D with small clots and good catheter output.","Client B with a purple colostomy."],"correct":0,"topics":["Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"KEY CLUE: stridor with upper-body/facial swelling suggests SVC syndrome with airway compromise. ANALYZE: a purple stoma is also urgent, but airway/breathing takes precedence. PRIORITY: Client C. TAKE ACTION: rapid airway-focused escalation. TRAP: Client B is the most tempting alternative because ischemic stoma needs prompt action, but it does not outrank active airway threat.","notes":["Best answer: KEY CLUE: stridor with upper-body/facial swelling suggests SVC syndrome with airway compromise. ANALYZE: a purple stoma is also urgent, but airway/breathing takes precedence. PRIORITY: Client C. TAKE ACTION: rapid airway-focused escalation. TRAP: Client B is the most tempting alternative because ischemic stoma needs prompt action, but it does not outrank active airway threat.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Priority/Clinical Judgment; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Priority/Clinical Judgment; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Priority/Clinical Judgment; it either addresses a different problem or would delay the needed response."],"id":130},{"type":"mcq","stem":"Which chest-tube finding requires immediate provider notification according to the course?","choices":["The drainage system is below chest level.","The tubing is straight without dependent loops.","New drainage greater than 70 mL/hr.","The client is using an incentive spirometer."],"correct":2,"topics":["Lung Cancer/Chest Tube","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"Course urgent chest-tube findings include drainage >70 mL/hr, sudden dyspnea, SpO₂ <90%, tracheal deviation, visible eyelets, disconnection/tube-out, or abrupt early cessation.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Lung Cancer/Chest Tube; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Lung Cancer/Chest Tube; it either addresses a different problem or would delay the needed response.","Best answer: Course urgent chest-tube findings include drainage >70 mL/hr, sudden dyspnea, SpO₂ <90%, tracheal deviation, visible eyelets, disconnection/tube-out, or abrupt early cessation.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Lung Cancer/Chest Tube; it either addresses a different problem or would delay the needed response."],"id":131},{"type":"mcq","stem":"A client with previous severe CINV is scheduled for chemotherapy at 0900. Which action best prevents uncontrolled symptoms?","choices":["Use only nonpharmacologic measures after vomiting begins.","Withhold all antiemetics if the client feels well at 0830.","Administer the prescribed antiemetic before chemotherapy and continue it on schedule.","Wait until the client vomits before giving medication."],"correct":2,"topics":["CINV/Symptom Management"],"paint":"Interventions/Take Action","priority":false,"teaching":false,"core":"Course materials repeatedly state that CINV medications work best preventively, before nausea/vomiting begins, and should continue as ordered.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for CINV/Symptom Management; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for CINV/Symptom Management; it either addresses a different problem or would delay the needed response.","Best answer: Course materials repeatedly state that CINV medications work best preventively, before nausea/vomiting begins, and should continue as ordered.","Why not: this delays care despite a course-identified urgent cue; the item requires earlier assessment/escalation or treatment."],"id":132},{"type":"mcq","stem":"Several hours after chemotherapy, a client develops weakness, flank pain, potassium 6.1 mEq/L, hyperphosphatemia, hyperuricemia, and rising creatinine. What is the priority?","choices":["Delay intervention until the next chemotherapy cycle.","Begin fluid restriction for SIADH.","Urgent tumor-lysis management with aggressive hydration, cardiac/electrolyte/renal monitoring, and ordered uric-acid therapy.","Apply a cool sitz bath."],"correct":2,"topics":["Oncologic Emergencies","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"Rapid tumor destruction with hyperkalemia, hyperuricemia, hyperphosphatemia, and AKI cues is tumor lysis syndrome; heart and kidneys are immediately threatened.","notes":["Why not: this delays care despite a course-identified urgent cue; the item requires earlier assessment/escalation or treatment.","Why not: fluid restriction fits SIADH; TLS and hypercalcemia are course-linked to aggressive hydration rather than routine restriction.","Best answer: Rapid tumor destruction with hyperkalemia, hyperuricemia, hyperphosphatemia, and AKI cues is tumor lysis syndrome; heart and kidneys are immediately threatened.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response."],"id":133},{"type":"mcq","stem":"A client receiving 5-fluorouracil has diarrhea and worsening oral ulcers. Which nursing focus best matches the drug class?","choices":["Protect hydration, perform frequent oral care, and monitor for neutropenia/infection.","Assess the postoperative JP reservoir for compression.","Encourage alcohol-containing mouthwash.","Restrict fluids to reduce diarrhea."],"correct":0,"topics":["Chemotherapy","Chemotherapy Toxicities"],"paint":"Interventions/Take Action","priority":false,"teaching":false,"core":"Antimetabolites are linked in the course to diarrhea, mucositis, and high neutropenia risk; hydration and oral care are emphasized.","notes":["Best answer: Antimetabolites are linked in the course to diarrhea, mucositis, and high neutropenia risk; hydration and oral care are emphasized.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy; it either addresses a different problem or would delay the needed response.","Why not: alcohol-containing mouthwash irritates mucositis; saline or salt/soda rinses and gentle oral care are preferred.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy; it either addresses a different problem or would delay the needed response."],"id":134},{"type":"mcq","stem":"A client receiving external-beam radiation says, “The temporary markings are fading, so I scrub them each night.” What is the best response?","choices":["Encourage vigorous scrubbing to keep the skin clean.","Cover the markings with adhesive tape.","Apply scented lotion to restore the markings.","Teach the client to leave the treatment markings intact and cleanse gently with lukewarm water."],"correct":3,"topics":["Radiation Safety/Skin Care","Patient Teaching"],"paint":"Teaching/Evaluation","priority":false,"teaching":true,"core":"The course handout says to leave radiology markings intact, use lukewarm water, and avoid rubbing/scrubbing, tape, and irritants.","notes":["Why not: the course repeatedly uses gentle care for irradiated skin, mucositis, and peristomal tissue; vigorous rubbing/scrubbing can injure tissue or remove markings.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Radiation Safety/Skin Care; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Radiation Safety/Skin Care; it either addresses a different problem or would delay the needed response.","Best answer: The course handout says to leave radiology markings intact, use lukewarm water, and avoid rubbing/scrubbing, tape, and irritants."],"id":135},{"type":"sata","stem" eam, nocturia, and a uniformly enlarged elastic nontender prostate. Which interpretation is most consistent with the course?","choices":["Benign prostatic hyperplasia.","Acute lymphoblastic leukemia.","Tumor lysis syndrome.","Prostate cancer because a stony-hard irregular nodule is expected in BPH."],"correct":0,"topics":["BPH/Prostate Cancer"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"BPH is associated with obstructive LUTS and a uniform/elastic/nontender enlargement; prostate cancer is more suspicious with stony-hard irregularity/induration.","notes":["Best answer: BPH is associated with obstructive LUTS and a uniform/elastic/nontender enlargement; prostate cancer is more suspicious with stony-hard irregularity/induration.","Why not: this option does not match the course-supported cue, timing, or nursing priority for BPH/Prostate Cancer; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for BPH/Prostate Cancer; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for BPH/Prostate Cancer; it either addresses a different problem or would delay the needed response."],"id":142},{"type":"mcq","stem":"A client receives chemotherapy after colorectal tumor resection to destroy remaining malignant cells. Which term applies?","choices":["Neoadjuvant therapy.","Adjuvant therapy.","Brachytherapy.","Primary screening."],"correct":1,"topics":["Common Cancer Management"],"paint":"Pathophysiology/Risk","priority":false,"teaching":false,"core":"Adjuvant therapy is given after the primary/local treatment to destroy residual malignant cells and reduce recurrence risk.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Common Cancer Management; it either addresses a const TOTAL = QUESTIONS.length;
const STORAGE_KEY = "hcc3_cancer_exam2_180_v1";

let state = {
  current:0,
  answers:{},
  flags:{},
  submitted:false,
  theme:"light",
  reviewIndex:0
};

function safeLoad(){
  try{
    const x=localStorage.getItem(STORAGE_KEY);
    if(x){ const p=JSON.parse(x); state={...state,...p}; }
  }catch(e){}
}
function safeSave(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
}
safeLoad();

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function sameSet(a,b){
  if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length)return false;
  const x=[...a].sort((m,n)=>m-n),y=[...b].sort((m,n)=>m-n);
  return x.every((v,i)=>v===y[i]);
}
function typeLabel(q){
  if(q.type==="mcq") return "Multiple Choice";
  if(q.type==="case") return "Advanced Clinical Case";
  if(q.type==="identify") return "Identify the Condition/Complication";
  if(q.type==="sata") return q.exactCount ? `SATA — Select Exactly ${q.exactCount}` : "SATA — Select All That Apply";
  if(q.type==="bowtie") return "NGN Bow-Tie";
  if(q.type==="matching") return "Matching";
  return q.type;
}
function getAnswer(i){ return state.answers[i]; }
function isAnswered(i){
  const q=QUESTIONS[i],a=getAnswer(i);
  if(q.type==="mcq"||q.type==="identify"||q.type==="case") return Number.isInteger(a);
  if(q.type==="sata"){
    if(!Array.isArray(a))return false;
    if(q.exactCount)return a.length===q.exactCount;
    return a.length>0;
  }
  if(q.type==="bowtie") return a && Array.isArray(a.cues)&&a.cues.length===2 && Number.isInteger(a.condition) && Array.isArray(a.actions)&&a.actions.length===2;
  if(q.type==="matching") return a && Array.isArray(a.rows)&&a.rows.length===q.left.length && a.rows.every(v=>Number.isInteger(v));
  return false;
}
function scoreQuestion(q,a){
  if(q.type==="mcq"||q.type==="identify"||q.type==="case") return Number.isInteger(a)&&a===q.correct;
  if(q.type==="sata") return sameSet(a,q.correct);
  if(q.type==="bowtie") return !!a && sameSet(a.cues,q.correctCues)&&a.condition===q.correctCondition&&sameSet(a.actions,q.correctActions);
  if(q.type==="matching") return !!a && Array.isArray(a.rows)&&a.rows.length===q.mapping.length&&a.rows.every((v,i)=>v===q.mapping[i]);
  return false;
}
function answerText(q,a){
  if(a===undefined||a===null)return "Unanswered";
  if(q.type==="mcq"||q.type==="identify"||q.type==="case") return Number.isInteger(a)?q.choices[a]:"Unanswered";
  if(q.type==="sata") return Array.isArray(a)&&a.length?a.map(i=>q.choices[i]).join(" • "):"Unanswered";
  if(q.type==="bowtie"){
    if(!a)return "Unanswered";
    const cues=(a.cues||[]).map(i=>q.cues[i]).join(" • ")||"none";
    const cond=Number.isInteger(a.condition)?q.conditions[a.condition]:"none";
    const acts=(a.actions||[]).map(i=>q.actions[i]).join(" • ")||"none";
    return `Cues: ${cues} | Condition: ${cond} | Actions: ${acts}`;
  }
  if(q.type==="matching"){
    if(!a||!Array.isArray(a.rows))return "Unanswered";
    return q.left.map((l,i)=>`${l} → ${Number.isInteger(a.rows[i])?q.right[a.rows[i]]:"unanswered"}`).join(" | ");
  }
  return "Unanswered";
}
function correctText(q){
  if(q.type==="mcq"||q.type==="identify"||q.type==="case")return q.choices[q.correct];
  if(q.type==="sata")return q.correct.map(i=>q.choices[i]).join(" • ");
  if(q.type==="bowtie")return `Cues: ${q.correctCues.map(i=>q.cues[i]).join(" • ")} | Condition: ${q.conditions[q.correctCondition]} | Actions: ${q.correctActions.map(i=>q.actions[i]).join(" • ")}`;
  if(q.type==="matching")return q.left.map((l,i)=>`${l} → ${q.right[q.mapping[i]]}`).join(" | ");
}
function applyTheme(){
  document.body.dataset.theme=state.theme||"light";
  document.getElementById("themeBtn").textContent=state.theme==="dark"?"Light Mode":"Dark Mode";
}
function toggleTheme(){
  state.theme=state.theme==="dark"?"light":"dark";applyTheme();safeSave();
}
applyTheme();

function toggleNavigator(force){
  const p=document.getElementById("navPanel"),o=document.getElementById("overlay");
  const open=typeof force==="boolean"?force:!p.classList.contains("open");
  p.classList.toggle("open",open);o.classList.toggle("show",open);renderNavigator();
}
function closePanels(){
  document.getElementById("navPanel").classList.remove("open");
  if(!document.getElementById("submitModal").classList.contains("show")) document.getElementById("overlay").classList.remove("show");
}
function renderNavigator(){
  const g=document.getElementById("navGrid");g.innerHTML="";
  QUESTIONS.forEach((q,i)=>{
    const b=document.createElement("button");b.className="nav-q";b.textContent=i+1;
    if(isAnswered(i))b.classList.add("answered");
    if(state.flags[i])b.classList.add("flagged");
    if(i===state.current)b.classList.add("current");
    b.title=`Question ${i+1}${state.flags[i]?" • Flagged":""}${isAnswered(i)?" • Answered":" • Unanswered"}`;
    b.onclick=()=>goToQuestion(i);
    g.appendChild(b);
  });
}
function goToQuestion(i){
  state.current=i;safeSave();toggleNavigator(false);
  if(state.submitted) renderReview(i); else renderExam();
}
function setSingle(i,opt){
  if(state.submitted)return; state.answers[i]=opt;safeSave();renderExam();
}
function toggleSata(i,opt){
  if(state.submitted)return;
  const q=QUESTIONS[i];let a=Array.isArray(state.answers[i])?[...state.answers[i]]:[];
  if(a.includes(opt))a=a.filter(x=>x!==opt);
  else{
    if(q.exactCount && a.length>=q.exactCount){alert(`Select exactly ${q.exactCount}. Remove one selection before adding another.`);return;}
    a.push(opt);
  }
  state.answers[i]=a;safeSave();renderExam();
}
function toggleBow(i,part,opt){
  if(state.submitted)return;
  let a=state.answers[i]||{cues:[],condition:null,actions:[]};
  a={cues:[...(a.cues||[])],condition:a.condition,actions:[...(a.actions||[])]};
  if(part==="condition")a.condition=opt;
  else{
    let arr=a[part];
    if(arr.includes(opt))arr=arr.filter(x=>x!==opt);
    else{
      if(arr.length>=2){alert(`Choose exactly 2 ${part}. Remove one before adding another.`);return;}
      arr.push(opt);
    }
    a[part]=arr;
  }
  state.answers[i]=a;safeSave();renderExam();
}
function setMatch(i,row,optVal){
  if(state.submitted)return;
  let a=state.answers[i]||{rows:Array(QUESTIONS[i].left.length).fill(null)};
  if(!Array.isArray(a.rows)||a.rows.length!==QUESTIONS[i].left.length)a.rows=Array(QUESTIONS[i].left.length).fill(null);
  a.rows[row]=optVal===""?null:Number(optVal);state.answers[i]=a;safeSave();renderExam();
}
function toggleFlag(){
  if(state.submitted)return;
  const i=state.current;state.flags[i]=!state.flags[i];safeSave();renderExam();
}
function validateCurrent(){
  const q=QUESTIONS[state.current],a=getAnswer(state.current);
  if(q.type==="sata"&&q.exactCount&&Array.isArray(a)&&a.length>0&&a.length<q.exactCount){
    alert(`This question requires exactly ${q.exactCount} selections. You currently have ${a.length}.`);return false;
  }
  if(q.type==="bowtie"&&a){
    const started=(a.cues?.length||0)||Number.isInteger(a.condition)||(a.actions?.length||0);
    if(started&&!isAnswered(state.current)){
      alert("Complete the bow-tie with exactly 2 supporting cues, 1 condition, and 2 priority actions.");return false;
    }
  }
  return true;
}
function move(delta){
  if(!validateCurrent())return;
  state.current=Math.max(0,Math.min(TOTAL-1,state.current+delta));safeSave();renderExam();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderExam(){
  document.getElementById("resultsView").classList.add("hidden");
  document.getElementById("reviewView").classList.add("hidden");
  const v=document.getElementById("examView");v.classList.remove("hidden");
  const i=state.current,q=QUESTIONS[i],a=getAnswer(i);
  document.getElementById("progress").style.width=`${((i+1)/TOTAL)*100}%`;
  document.getElementById("statusLine").textContent=`Question ${i+1} of ${TOTAL} • ${typeLabel(q)} • ${Object.values(state.flags).filter(Boolean).length} flagged`;
  let body=`<div class="qmeta"><span>Question ${i+1} of ${TOTAL}</span><span class="qtype">${esc(typeLabel(q))}</span></div>
  <div class="stem">${esc(q.stem)}</div>`;
  if(q.type==="mcq"||q.type==="identify"||q.type==="case"){
    q.choices.forEach((c,idx)=>{
      const sel=a===idx;
      body+=`<label class="choice ${sel?"selected":""}"><input type="radio" name="q${i}" ${sel?"checked":""} onclick="setSingle(${i},${idx})"><span><b>${String.fromCharCode(65+idx)}.</b> ${esc(c)}</span></label>`;
    });
  }else if(q.type==="sata"){
    body+=`<div class="hintline">${q.exactCount?`Choose exactly ${q.exactCount}. Selection beyond ${q.exactCount} is prevented.`:"Select every option you believe is correct."}</div>`;
    q.choices.forEach((c,idx)=>{
      const sel=Array.isArray(a)&&a.includes(idx);
      body+=`<label class="choice ${sel?"selected":""}"><input type="checkbox" ${sel?"checked":""} onclick="toggleSata(${i},${idx})"><span><b>${String.fromCharCode(65+idx)}.</b> ${esc(c)}</span></label>`;
    });
  }else if(q.type==="bowtie"){
    a=a||{cues:[],condition:null,actions:[]};
    body+=`<div class="hintline">Choose exactly 2 supporting cues, 1 condition/complication, and 2 priority nursing actions.</div><div class="bowgrid">`;
    body+=`<div class="bowcol"><h3>2 MOST IMPORTANT SUPPORTING CUES</h3>`;
    q.cues.forEach((c,idx)=>{const sel=(a.cues||[]).includes(idx);body+=`<label class="choice ${sel?"selected":""}"><input type="checkbox" ${sel?"checked":""} onclick="toggleBow(${i},'cues',${idx})"><span>${esc(c)}</span></label>`;});
    body+=`</div><div class="bowcol"><h3>1 MOST LIKELY CONDITION</h3>`;
    q.conditions.forEach((c,idx)=>{const sel=a.condition===idx;body+=`<label class="choice ${sel?"selected":""}"><input type="radio" name="cond${i}" ${sel?"checked":""} onclick="toggleBow(${i},'condition',${idx})"><span>${esc(c)}</span></label>`;});
    body+=`</div><div class="bowcol"><h3>2 PRIORITY NURSING ACTIONS</h3>`;
    q.actions.forEach((c,idx)=>{const sel=(a.actions||[]).includes(idx);body+=`<label class="choice ${sel?"selected":""}"><input type="checkbox" ${sel?"checked":""} onclick="toggleBow(${i},'actions',${idx})"><span>${esc(c)}</span></label>`;});
    body+=`</div></div>`;
  }else if(q.type==="matching"){
    a=a||{rows:Array(q.left.length).fill(null)};
    body+=`<div class="hintline">Use each dropdown to choose the best match. The question earns 1 point when all matches are correct.</div>`;
    q.left.forEach((l,row)=>{
      body+=`<div class="match-row"><label>${esc(l)}</label><select onchange="setMatch(${i},${row},this.value)"><option value="">Choose a match…</option>`;
      q.right.forEach((r,idx)=>{body+=`<option value="${idx}" ${a.rows?.[row]===idx?"selected":""}>${esc(r)}</option>`;});
      body+=`</select></div>`;
    });
  }
  body+=`<div class="controls"><div class="left">
    <button class="btn" onclick="move(-1)" ${i===0?"disabled":""}>Back</button>
    <button class="btn ${state.flags[i]?"flagged":""}" onclick="toggleFlag()">${state.flags[i]?"Unflag":"Flag for Review"}</button>
    <button class="btn" onclick="toggleNavigator()">Question Navigator</button>
  </div><div class="right">
    ${i<TOTAL-1?`<button class="btn primary" onclick="move(1)">Next</button>`:""}
    <button class="btn primary" onclick="askSubmit()">Submit Exam</button>
  </div></div>`;
  v.innerHTML=body;renderNavigator();
}
function askSubmit(){
  const incomplete=[];for(let i=0;i<TOTAL;i++)if(!isAnswered(i))incomplete.push(i+1);
  const msg=incomplete.length
    ? `${incomplete.length} question(s) are unanswered or incomplete. You can return to the exam, or submit anyway. Unanswered questions score as incorrect.`
    : `All ${TOTAL} questions have complete responses. Submit now?`;
  document.getElementById("submitMessage").textContent=msg;
  document.getElementById("submitModal").classList.add("show");
  document.getElementById("overlay").classList.add("show");
}
function closeSubmitModal(){
  document.getElementById("submitModal").classList.remove("show");
  document.getElementById("overlay").classList.remove("show");
}
function finalizeSubmit(){
  state.submitted=true;state.reviewIndex=0;safeSave();closeSubmitModal();renderResults();window.scrollTo(0,0);
}

function breakdownFor(items){
  let c=0;items.forEach(i=>{if(scoreQuestion(QUESTIONS[i],getAnswer(i)))c++;});
  return {correct:c,total:items.length,pct:items.length?Math.round(c/items.length*100):0};
}
const CONTENT_ORDER = ["Foundations/Cellular Regulation","Common Cancer Management","Chemotherapy","Chemotherapy Toxicities","CINV/Symptom Management","Radiation Therapy","Radiation Safety/Skin Care","Neutropenia","Thrombocytopenia","Oncologic Emergencies","Nutrition/Parenteral Nutrition","Breast Cancer/Mastectomy","Colorectal Cancer/Ostomy","Lung Cancer/Chest Tube","BPH/Prostate Cancer","TURP/CBI","ALL","Blood Transfusion/HSCT","Cancer Screening/Health Promotion","Priority/Clinical Judgment","Patient Teaching"];
const PAINT_ORDER = ["Pathophysiology/Risk","Assessment/Recognize Cues","Interventions/Take Action","Nursing Safety/Complications","Teaching/Evaluation"];

function metricHtml(name,b){
  return `<div class="metric"><div class="metric-row"><strong>${esc(name)}</strong><span>${b.correct}/${b.total} (${b.pct}%)</span></div></div>`;
}
function renderResults(){
  document.getElementById("examView").classList.add("hidden");
  document.getElementById("reviewView").classList.add("hidden");
  const v=document.getElementById("resultsView");v.classList.remove("hidden");
  document.getElementById("progress").style.width="100%";
  const correct=QUESTIONS.reduce((n,q,i)=>n+(scoreQuestion(q,getAnswer(i))?1:0),0);
  const pct=(correct/TOTAL*100).toFixed(1);
  document.getElementById("statusLine").textContent=`Submitted • Score ${correct}/${TOTAL} • ${pct}%`;
  let html=`<h2>Exam Results</h2><div class="scorebox"><div><div class="subtitle">SCORE</div><div class="bigscore">${correct} / ${TOTAL}</div></div><div><div class="subtitle">PERCENTAGE</div><div class="bigpct">${pct}%</div></div></div>`;
  html+=`<div class="breakdowns"><div><h3>Content Performance</h3>`;
  CONTENT_ORDER.forEach(cat=>{
    const ids=[];QUESTIONS.forEach((q,i)=>{if((q.topics||[]).includes(cat))ids.push(i);});
    if(ids.length)html+=metricHtml(cat,breakdownFor(ids));
  });
  html+=`</div><div><h3>PAINT / Clinical-Reasoning Performance</h3>`;
  PAINT_ORDER.forEach(cat=>{
    const ids=[];QUESTIONS.forEach((q,i)=>{if(q.paint===cat)ids.push(i);});
    html+=metricHtml(cat,breakdownFor(ids));
  });
  html+=`</div></div><div class="controls"><div class="left"><button class="btn primary" onclick="renderReview(0)">Review All 180 Questions</button></div><div class="right"><button class="btn" onclick="restartExam()">Restart Exam</button></div></div>
  <div class="source-note"><strong>Source fidelity:</strong> This exam was built to the HCC3 Exam 2 Cellular Regulation/Cancer Learning Map and supplied professor PAINT/concept maps, presentations/handouts, cancer study guide, and assigned cancer textbook pages. Course-specific conflicts are preserved rather than overwritten with outside oncology guidance.</div>`;
  v.innerHTML=html;
}
function renderStructuredRationale(q){
  let h=`<div class="rationale"><h3>Teaching Rationale</h3>`;
  const core=esc(q.core||"");
  if(q.type==="identify"){
    const parts=(q.core||"").split(/(?=EVIDENCE:|INTERPRETATION:|CONDITION:)/);
    parts.filter(Boolean).forEach(p=>{
      const m=p.match(/^(EVIDENCE|INTERPRETATION|CONDITION):\s*(.*)$/s);
      if(m)h+=`<div class="r-step"><strong>${m[1]} →</strong> ${esc(m[2])}</div>`;
    });
  }else if(q.priority){
    if((q.core||"").includes("KEY CLUE:")){
      const parts=(q.core||"").split(/(?=KEY CLUE:|ANALYZE:|PRIORITY:|TAKE ACTION:|TRAP:)/);
      parts.filter(Boolean).forEach(p=>{
        const m=p.match(/^(KEY CLUE|ANALYZE|PRIORITY|TAKE ACTION|TRAP):\s*(.*)$/s);
        if(m)h+=`<div class="r-step"><strong>${m[1]} →</strong> ${esc(m[2])}</div>`;
        else h+=`<div class="r-step">${esc(p)}</div>`;
      });
    }else{
      h+=`<div class="r-step"><strong>KEY CLUE →</strong> Focus on the abnormal cue, timing, device change, treatment toxicity, or safety issue in the stem.</div>
      <div class="r-step"><strong>ANALYZE →</strong> ${core}</div>
      <div class="r-step"><strong>PRIORITY →</strong> The best answer is the response that addresses the most immediate course-supported threat.</div>
      <div class="r-step"><strong>TAKE ACTION →</strong> ${esc(correctText(q))}</div>
      <div class="r-step"><strong>TRAP →</strong> A competing option may be reasonable in another context, but it is either mistimed, less urgent, or aimed at the wrong complication.</div>`;
    }
  }else if(q.teaching){
    h+=`<div class="r-step"><strong>TEACH →</strong> ${core}</div>
    <div class="r-step"><strong>EVALUATE →</strong> Understanding is demonstrated by choosing the statement/action that matches the exact course precaution, symptom-management strategy, screening point, or reportable finding.</div>`;
  }else{
    h+=`<div class="r-step">${core}</div>`;
  }
  h+=`</div>`;return h;
}
function renderChoiceReview(q,a){
  if(!["mcq","identify","case","sata"].includes(q.type))return "";
  let h=`<div class="rationale"><h3>Answer-Choice Review</h3>`;
  q.choices.forEach((c,idx)=>{
    const isCorrect=q.type==="sata"?q.correct.includes(idx):idx===q.correct;
    const chosen=q.type==="sata"?Array.isArray(a)&&a.includes(idx):a===idx;
    const cls=isCorrect?"correct":(chosen?"userwrong":"");
    h+=`<div class="option-review ${cls}"><strong>${String.fromCharCode(65+idx)}. ${esc(c)}</strong><br><span>${esc(q.notes?.[idx]||"")}</span>${chosen?` <em>— Your selection</em>`:""}${isCorrect?` <em>— Correct</em>`:""}</div>`;
  });
  return h+`</div>`;
}
function renderMatchingReview(q,a){
  let h=`<div class="rationale"><h3>Match-by-Match Review</h3>`;
  q.left.forEach((l,i)=>{
    const mine=a?.rows?.[i];const ok=mine===q.mapping[i];
    h+=`<div class="option-review ${ok?"correct":"userwrong"}"><strong>${esc(l)}</strong><br>Your match: ${esc(Number.isInteger(mine)?q.right[mine]:"Unanswered")}<br>Correct match: ${esc(q.right[q.mapping[i]])}</div>`;
  });
  return h+`</div>`;
}
function renderBowReview(q,a){
  const my=answerText(q,a),cor=correctText(q);
  return `<div class="rationale"><h3>Bow-Tie Review</h3><div class="r-step"><strong>Your bow-tie →</strong> ${esc(my)}</div><div class="r-step"><strong>Correct bow-tie →</strong> ${esc(cor)}</div></div>`;
}
function renderReview(i){
  state.reviewIndex=i;state.current=i;safeSave();
  document.getElementById("examView").classList.add("hidden");
  document.getElementById("resultsView").classList.add("hidden");
  const v=document.getElementById("reviewView");v.classList.remove("hidden");
  const q=QUESTIONS[i],a=getAnswer(i),ok=scoreQuestion(q,a);
  document.getElementById("progress").style.width=`${((i+1)/TOTAL)*100}%`;
  document.getElementById("statusLine").textContent=`Review Mode • Question ${i+1} of ${TOTAL}`;
  let h=`<div class="reviewbar"><div><strong>Review Question ${i+1} of ${TOTAL}</strong><div class="subtitle">${esc(typeLabel(q))}</div></div><button class="btn" onclick="renderResults()">Back to Results</button></div>
  <div class="stem">${esc(q.stem)}</div>
  <div class="answer-box"><div class="${ok?"result-good":"result-bad"}">${ok?"CORRECT":"INCORRECT"}</div><p><strong>My answer:</strong> ${esc(answerText(q,a))}</p><p><strong>Correct answer:</strong> ${esc(correctText(q))}</p></div>`;
  if(q.type==="matching")h+=renderMatchingReview(q,a);
  else if(q.type==="bowtie")h+=renderBowReview(q,a);
  else h+=renderChoiceReview(q,a);
  h+=renderStructuredRationale(q);
  h+=`<div class="controls"><div class="left"><button class="btn" onclick="reviewMove(-1)" ${i===0?"disabled":""}>Previous Review</button></div><div class="right"><button class="btn" onclick="toggleNavigator()">Question Navigator</button><button class="btn primary" onclick="reviewMove(1)" ${i===TOTAL-1?"disabled":""}>Next Review</button></div></div>`;
  v.innerHTML=h;renderNavigator();window.scrollTo(0,0);
}
function reviewMove(d){const n=Math.max(0,Math.min(TOTAL-1,state.reviewIndex+d));renderReview(n);}
function restartExam(){
  if(!confirm("Restart the exam? This clears all saved answers, flags, and the submitted score."))return;
  const theme=state.theme;state={current:0,answers:{},flags:{},submitted:false,theme,reviewIndex:0};safeSave();renderExam();window.scrollTo(0,0);
}

(function verifyBank(){
  const counts={};QUESTIONS.forEach(q=>counts[q.type]=(counts[q.type]||0)+1);
  const expected={mcq:85,sata:60,identify:15,bowtie:6,matching:4,case:10};
  const exact=QUESTIONS.filter(q=>q.type==="sata"&&q.exactCount).length;
  const valid=TOTAL===180&&Object.keys(expected).every(k=>counts[k]===expected[k])&&exact===30;
  if(!valid){
    document.body.innerHTML="<main class='main'><div class='card'><h2>Question-bank verification failed.</h2><p>The exam did not load because the required counts were not met.</p></div></main>";
    throw new Error("HCC3 bank verification failed");
  }
})();

if(state.submitted)renderResults();else renderExam();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCC3 Exam 2 — Cellular Regulation/Cancer Practice Exam</title>
<style>
:root{
  --bg:#f4f7fb;--panel:#ffffff;--text:#152238;--muted:#5f6f82;--line:#d7e0ea;
  --blue:#154f7d;--blue2:#0f3d63;--blueSoft:#e8f1f8;--flag:#8a5c00;
  --ok:#216e3a;--bad:#a52a2a;--shadow:0 2px 10px rgba(15,61,99,.08);
}
body[data-theme="dark"]{
  --bg:#111820;--panel:#19232e;--text:#eef4f9;--muted:#aebdca;--line:#344556;
  --blue:#74a9d3;--blue2:#9bc3e1;--blueSoft:#20374a;--flag:#e3b65b;
  --ok:#79c992;--bad:#ff8f8f;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
button,input,select{font:inherit}
button{cursor:pointer}
.header{
  position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
}
.header-inner{max-width:1120px;margin:auto;padding:14px 20px}
.title-row{display:flex;justify-content:space-between;gap:14px;align-items:center}
h1{font-size:20px;line-height:1.2;margin:0;color:var(--blue2);letter-spacing:.2px}
.subtitle{font-size:13px;color:var(--muted);margin-top:4px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;
  padding:9px 13px;font-weight:700
}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue2);color:white;border-color:var(--blue2)}
.btn.flagged{border-color:var(--flag);color:var(--flag)}
.progress-wrap{margin-top:12px;height:7px;background:var(--line);border-radius:999px;overflow:hidden}
.progress{height:100%;width:0;background:var(--blue);transition:width .15s ease}
.main{max-width:980px;margin:24px auto;padding:0 20px 50px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:24px}
.qmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-weight:700}
.qtype{color:var(--blue2)}
.stem{font-size:19px;font-weight:700;margin:18px 0 20px}
.choice{
  display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;
  padding:12px 13px;margin:10px 0;background:var(--panel)
}
.choice:hover{border-color:var(--blue)}
.choice input{margin-top:4px;transform:scale(1.12)}
.choice.selected{border-color:var(--blue);background:var(--blueSoft)}
.hintline{font-size:13px;color:var(--muted);margin:4px 0 12px}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.controls .left,.controls .right{display:flex;gap:9px;flex-wrap:wrap}
.bowgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}
.bowcol{border:1px solid var(--line);border-radius:8px;padding:12px}
.bowcol h3{font-size:14px;margin:0 0 8px;color:var(--blue2)}
.match-row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,1.4fr);gap:12px;align-items:center;margin:12px 0}
.match-row label{font-weight:700}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text)}
.nav-panel{
  position:fixed;right:0;top:0;height:100vh;width:min(420px,92vw);background:var(--panel);z-index:40;
  border-left:1px solid var(--line);box-shadow:-6px 0 20px rgba(0,0,0,.12);padding:20px;overflow:auto;
  transform:translateX(105%);transition:transform .18s ease
}
.nav-panel.open{transform:translateX(0)}
.nav-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:16px}
.nav-q{aspect-ratio:1;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--text);font-size:12px;font-weight:700}
.nav-q.answered{background:var(--blueSoft);border-color:var(--blue)}
.nav-q.flagged{outline:2px solid var(--flag);outline-offset:1px}
.nav-q.current{background:var(--blue2);color:white;border-color:var(--blue2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border:1px solid var(--line);margin-right:5px;vertical-align:-1px;border-radius:2px}
.legend .la::before{background:var(--blueSoft);border-color:var(--blue)}
.legend .lf::before{outline:2px solid var(--flag)}
.legend .lc::before{background:var(--blue2)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:35;display:none}
.overlay.show{display:block}
.modal{
  position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:none
}
.modal.show{display:block}
.modal h2{margin:0 0 8px;color:var(--blue2)}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.results h2,.review h2{color:var(--blue2)}
.scorebox{display:flex;gap:25px;align-items:end;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}
.bigscore{font-size:36px;font-weight:800}
.bigpct{font-size:25px;font-weight:800;color:var(--blue2)}
.breakdowns{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.metric{border-bottom:1px solid var(--line);padding:8px 0}
.metric-row{display:flex;justify-content:space-between;gap:12px}
.metric small{color:var(--muted)}
.reviewbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.answer-box{border:1px solid var(--line);border-radius:8px;padding:13px;margin:10px 0}
.result-good{color:var(--ok);font-weight:800}
.result-bad{color:var(--bad);font-weight:800}
.rationale{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}
.rationale h3{color:var(--blue2);margin:0 0 10px}
.r-step{margin:8px 0}
.option-review{padding:10px;border-left:3px solid var(--line);margin:8px 0;background:var(--bg)}
.option-review.correct{border-left-color:var(--ok)}
.option-review.userwrong{border-left-color:var(--bad)}
.source-note{font-size:12px;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
.hidden{display:none!important}
@media(max-width:760px){
  .bowgrid,.breakdowns{grid-template-columns:1fr}
  .nav-grid{grid-template-columns:repeat(8,1fr)}
  .match-row{grid-template-columns:1fr}
  .card{padding:17px}
  .stem{font-size:17px}
}
</style>
</head>

      <div>
        <h1>HCC3 EXAM 2 — CELLULAR REGULATION/CANCER PRACTICE EXAM</h1>

</header>

<main class="main">

<div class="overlay" id="overlay" onclick="closePanels()"></div>

<div class="modal" id="submitModal">

  </div>
</div>

ty for Cancer Screening/Health Promotion; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Cancer Screening/Health Promotion; it either addresses a different problem or would delay the needed response.","Best answer: The colorectal PAINT key points emphasize routine screening beginning at age 45, with earlier/more frequent screening for higher-risk clients.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Cancer Screening/Health Promotion; it either addresses a different problem or would delay the needed response."],"id":2},{"type":"identify","stem":"A client with metastatic cancer reports progressive back pain, leg weakness, tingling, unsteady gait, and new urinary retention. Which emergency is most consistent?","choices":["SIADH","SVC syndrome","Spinal cord compression","Chemotherapy extravasation"],"correct":2,"topics":["Oncologic Emergencies","Priority/Clinical Judgment"],"paint":"Assessment/Recognize Cues","priority":true,"teaching":false,"core":"EVIDENCE: worsening back pain plus motor/sensory/gait and bladder changes. INTERPRETATION: neurologic structures are being compressed and function may be permanently lost without rapid treatment. CONDITION: spinal cord compression.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Best answer: EVIDENCE: worsening back pain plus motor/sensory/gait and bladder changes. INTERPRETATION: neurologic structures are being compressed and function may be permanently lost without rapid treatment. CONDITION: spinal cord compression.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response."],"id":3},{"type":"mcq","stem":"A client receiving vincristine becomes unsteady and reports numb feet. Which intervention has the highest priority?","choices":["Apply heat to the numb areas.","Restrict all oral fluids.","Assist with ambulation and institute fall/injury prevention.","Encourage unassisted stair climbing to maintain strength."],"correct":2,"topics":["Chemotherapy","Chemotherapy Toxicities","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"Antimitotics can cause peripheral neuropathy; the course emphasizes assistance with ambulation and fall prevention.","notes":["Why not: the radiotherapy handout specifically prohibits heating devices/temperature extremes on the irradiated site.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy; it either addresses a different problem or would delay the needed response.","Best answer: Antimitotics can cause peripheral neuropathy; the course emphasizes assistance with ambulation and fall prevention.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy; it either addresses a different problem or would delay the needed response."],"id":4},{"type":"matching","stem":"Match each oncologic emergency with the hallmark cue cluster from the course.","left":["Spinal cord compression","SVC syndrome","Tumor lysis syndrome","SIADH","Hypercalcemia","DIC"],"right":["Progressive back pain + weakness/tingling/gait or bladder changes","Upper-body edema/venous distention + dyspnea/stridor","Post-treatment hyperkalemia + hyperuricemia + hyperphosphatemia + renal injury","Water retention + hyponatremia + neurologic/personality change","Constipation + polyuria + dehydration + weakness/confusion","Widespread clotting-factor/platelet consumption with oozing/bleeding and organ ischemia"],"mapping":[0,1,2,3,4,5],"topics":["Oncologic Emergencies"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"These emergencies are differentiated by clusters, not isolated symptoms: neurologic compression, upper-body venous obstruction, tumor-cell breakdown electrolytes, dilutional hyponatremia, high-calcium/dehydration pattern, and simultaneous clotting/bleeding.","id":5},{"type":"sata","stem":"Before the next treatment cycle, select the radiation-safety actions that are consistent with the exact HCC3 radiotherapy handout. SELECT EXACTLY 3.","choices":["Apply a heating pad directly to an irradiated site.","Bedrest may be used to reduce sealed-source dislodgement.","With an unsealed source, body fluids are contaminated, especially during the first 24–96 hours.","Pick up a dislodged sealed source with gloved hands.","Scrub off external-radiation markings after each treatment.","Urine, feces, and linens are not radioactive with the sealed source described in the course."],"correct":[1,2,5],"exactCount":3,"topics":["Radiation Therapy","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"The correct selections are the course-supported statements for Radiation Therapy. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario."],"id":6},{"type":"mcq","stem":"A client with CBI after TURP reports severe bladder spasms and drainage has sharply decreased. What should the nurse do FIRST?","choices":["Check the tubing for kinks/clots and address catheter patency per protocol.","Document the finding as expected and take no action.","Stop all irrigation permanently.","Increase opioid dosing without checking urine flow."],"correct":0,"topics":["TURP/CBI","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"Severe bladder spasms with decreased output suggest obstruction. Course sequence: check kinks/clots, irrigate per protocol, notify surgeon if unresolved.","notes":["Best answer: Severe bladder spasms with decreased output suggest obstruction. Course sequence: check kinks/clots, irrigate per protocol, notify surgeon if unresolved.","Why not: this option does not match the course-supported cue, timing, or nursing priority for TURP/CBI; it either addresses a different problem or would delay the needed response.","Why not: the course does not call for permanent cessation here; it supports progressive arm exercise after mastectomy and patency-directed CBI management.","Why not: this option does not match the course-supported cue, timing, or nursing priority for TURP/CBI; it either addresses a different problem or would delay the needed response."],"id":7},{"type":"sata","stem":"Before the next treatment cycle, the nurse is reviewing chemotherapy safety and class toxicities. Select the statements that match the supplied course material. SELECT EXACTLY 4.","choices":["Antiemetics work best only after vomiting becomes uncontrolled.","Antimetabolites are associated with neutropenia, diarrhea, and mucositis.","Antimitotics can cause peripheral neuropathy and severe constipation.","All chemotherapy classes have identical toxicities.","Blood return and the IV site should be checked during vesicant infusion.","Topoisomerase inhibitors can cause significant diarrhea requiring hydration/antidiarrheals.","Peripheral neuropathy is unrelated to antimitotics."],"correct":[1,2,4,5],"exactCount":4,"topics":["Chemotherapy","Chemotherapy Toxicities","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"The correct selections are the course-supported statements for Chemotherapy. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary."],"id":8},{"type":"case","stem":"An 11-year-old with ALL is Day +8 after HSCT. Platelets are 9,000/mm³, hemoglobin remains low, and WBCs have not yet recovered. The child has new petechiae but no active major hemorrhage. Which action is the priority?","choices":["Report the platelet count, prepare for platelet transfusion, and maintain strict bleeding/infection precautions.","Encourage vigorous exercise to speed engraftment.","Assume the transplant has failed because counts are low before engraftment.","Give aspirin for bone discomfort."],"correct":0,"topics":["Blood Transfusion/HSCT","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"KEY CLUE: platelets are below the ALL concept-map threshold of 10,000/mm³ before engraftment. ANALYZE: pancytopenia is expected during this phase, but severe bleeding risk still requires action. PRIORITY: prevent hemorrhage and infection. TAKE ACTION: report, prepare platelet support, and continue precautions. TRAP: low counts before engraftment are expected and do not alone prove failure to engraft.","notes":["Best answer: KEY CLUE: platelets are below the ALL concept-map threshold of 10,000/mm³ before engraftment. ANALYZE: pancytopenia is expected during this phase, but severe bleeding risk still requires action. PRIORITY: prevent hemorrhage and infection. TAKE ACTION: report, prepare platelet support, and continue precautions. TRAP: low counts before engraftment are expected and do not alone prove failure to engraft.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Blood Transfusion/HSCT; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Blood Transfusion/HSCT; it either addresses a different problem or would delay the needed response.","Why not: aspirin is specifically avoided with thrombocytopenia/bleeding risk unless prescribed, and the ALL aspiration teaching uses aspirin-free analgesia."],"id":9},{"type":"sata","stem":"While analyzing a new symptom cluster, the nurse is teaching a client with chemotherapy-related thrombocytopenia. Select the appropriate bleeding precautions. SELECT ALL THAT APPLY.","choices":["Use rectal suppositories for constipation regardless of platelet count.","Avoid enemas ion + anemia + bleeding together with very high immature blasts and marrow-line suppression. INTERPRETATION: nonfunctional blasts are crowding normal marrow. CONDITION: ALL.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for ALL; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for ALL; it either addresses a different problem or would delay the needed response.","Best answer: EVIDENCE: infection + anemia + bleeding together with very high immature blasts and marrow-line suppression. INTERPRETATION: nonfunctional blasts are crowding normal marrow. CONDITION: ALL.","Why not: this option does not match the course-supported cue, timing, or nursing priority for ALL; it either addresses a different problem or would delay the needed response."],"id":11},{"type":"sata","stem":"While reviewing the plan with a new oncology nurse, the nurse is reviewing chemotherapy safety and class toxicities. Select the statements that match the supplied course material. SELECT EXACTLY 3.","choices":["Hydration should be restricted before alkylating agents.","Topoisomerase inhibitors can cause significant diarrhea requiring hydration/antidiarrheals.","Oral chemotherapy may be handled freely with bare hands.","Combination chemotherapy can increase cancer-cell kill but can also increase toxicity.","A burning swollen vesicant IV site is an expected finding that needs no action.","Profound neutropenia or severe mucositis can require treatment clarification/holding."],"correct":[1,3,5],"exactCount":3,"topics":["Chemotherapy","Chemotherapy Toxicities","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"The correct selections are the course-supported statements for Chemotherapy. Distractors deliberately represent actions or interpretations that conflict with the professor ource precautions include time, distance, shielding, no pregnant visitors/children under 16, ≥6-foot distance, and ≤30 minutes/day."],"id":18},{"type":"matching","stem":"Match the procedure/device situation with the course-supported priority response.","left":["Chest tube falls out of the chest","Chest tube disconnects from drainage system","Post-mastectomy JP drain","CBI with severe spasms + low output","Purple/black dry stoma","ALL platelets <10,000/mm³"],"right":["Cover the chest site with dry sterile gauze, then rapidly escalate","Place tube end in sterile water below chest level while restoring the system","Maintain compression; empty, measure, and record output","Check kinks/clots, restore patency/irrigate per protocol, notify if unresolved","Report promptly for impaired perfusion/ischemia","Report and prepare for platelet transfusion while maintaining bleeding precautions"],"mapping":[0,1,2,3,4,5],"topics":["Lung Cancer/Chest Tube","Breast Cancer/Mastectomy","TURP/CBI","Colorectal Cancer/Ostomy","ALL"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"Device rescue depends on the exact problem: tube-out and disconnection have different first actions; JP care preserves suction and measures output; CBI obstruction requires patency; a dark dry stoma suggests ischemia; severe ALL thrombocytopenia requires transfusion preparation.","id":19},{"type":"mcq","stem":"Which statement by a client with a new colostomy shows correct pouch management?","choices":["“I should scrub the peristomal skin aggressively.”","“I will empty the pouch when it is about one-third to one-half full.”","“A black dry stoma is expected.”","“I should wait until the pouch is completely full.”"],"correct":1,"topics":["Colorectal Cancer/Ostomy","Patient Teaching"],"paint":"Teaching/Evaluation","priority":false,"teaching":true,"core":"The course recommends emptying the pouch at about 1/3–1/2 full and keeping peristomal skin clean and dry.","notes":["Why not: the course alse,"teaching":false,"core":"DIC combines widespread abnormal clotting with consumption of platelets/clotting factors, producing both ischemic organ dysfunction and bleeding.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Best answer: DIC combines widespread abnormal clotting with consumption of platelets/clotting factors, producing both ischemic organ dysfunction and bleeding.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response."],"id":60},{"type":"identify","stem":"A client with small-cell lung cancer has sodium 121 mEq/L, recent weight gain, muscle cramps, personality change, and increasing confusion. Which emergency is most consistent?","choices":["Chest-tube disconnection","SIADH","Hypercalcemia","DIC"],"correct":1,"topics":["Oncologic Emergencies","Priority/Clinical Judgment"],"paint":"Assessment/Recognize Cues","priority":true,"teaching":false,"core":"EVIDENCE: water-retention pattern + marked hyponatremia + neurologic change. INTERPRETATION: excess ADH is causing dilutional hyponatremia. CONDITION: SIADH.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Best answer: EVIDENCE: water-retention pattern + marked hyponatremia + neurologic change. INTERPRETATION: excess ADH is causing dilutional hyponatremia. CONDITION: SIADH.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response."],"id":61},{"type":"mcq","stem":"A client after lobectomy with a chest tube suddenly develops dyspnea and SpO₂ 88%. Which action should the nurse take FIRST?","choices":["Focus first on discharge smoking-cessation teaching.","Finish routine documentation before entering the room.","Wait for the next scheduled drainage measurement.","Assess breathing/oxygenation and chest-tube system integrity immediately."],"correct":3,"topics":["Lung Cancer/Chest Tube","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"A sudden respiratory change after thoracic surgery is an ABC priority. Course red flags include dyspnea, SpO₂ <90%, tracheal deviation, or device disruption.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Lung Cancer/Chest Tube; it either addresses a different problem or would delay the needed response.","Why not: completing a routine task cannot outrank an acute safety problem such as extravasation, cardiotoxicity, or respiratory deterioration.","Why not: this delays care despite a course-identified urgent cue; the item requires earlier assessment/escalation or treatment.","Best answer: A sudden respiratory change after thoracic surgery is an ABC priority. Course red flags include dyspnea, SpO₂ <90%, tracheal deviation, or device disruption."],"id":62},{"type":"sata","stem":"While evaluating the client’s home-care plan, the nurse is reviewing chemotherapy safety and class toxicities. Select the statements that match the supplied course material. SELECT EXACTLY 4.","choices":["Combination chemotherapy can increase cancer-cell kill but can also increase toxicity.","Hydration should be restricted before alkylating agents.","Oral chemotherapy may be handled freely with bare hands.","Antimitotics can cause peripheral neuropathy and severe constipation.","Topoisomerase inhibitors can cause significant diarrhea requiring hydration/antidiarrheals.","Oral chemotherapy remains hazardous and requires safe handling.","A burning swollen vesicant IV site is an expected finding that needs no action."],"correct":[0,3,4,5],"exactCount":4,"topics":["Chemotherapy","Chemotherapy Toxicities","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"The correct selections are the course-supported statements for Chemotherapy. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary."],"id":63},{"type":"sata","stem":"During a safety huddle, the nurse is reviewing chemotherapy safety and class toxicities. Select the statements that match the supplied course material. SELECT EXACTLY 2.","choices":["Antitumor antibiotics require attention to cardiac/pulmonary toxicity and vesicant extravasation.","Chemotherapy schedules are designed to allow normal-cell recovery while maintaining cancer-cell kill.","Peripheral neuropathy is unrelated to antimitotics.","Hydration should be restricted before alkylating agents.","A burning swollen vesicant IV site is an expected finding that needs no action."],"correct":[0,1],"exactCount":2,"topics":["Chemotherapy","Chemotherapy Toxicities","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"The correct selections are the course-supported statements for Chemotherapy. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary."],"id":64},{"type":"mcq","stem":"A client with small-cell lung cancer develops weight gain, sodium 122 mEq/L, confusion, and muscle cramps. Which complication is most consistent with the pattern?","choices":["SIADH.","Chemotherapy extravasation.","Hypercalcemia of malignancy.","TURP syndrome."],"correct":0,"topics":["Oncologic Emergencies"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"SIADH causes water retention and dilutional hyponatremia with weakness/cramps followed by neurologic change.","notes":["Best answer: SIADH causes water retention and dilutional hyponatremia with weakness/cramps followed by neurologic change.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response."],"id":65},{"type":"mcq","stem":"A client is Day +8 after HSCT and has very low RBC, WBC, and platelet counts. Which interpretation is most appropriate?","choices":["The transplant has definitely failed because counts must normalize by Day +1.","ABO mismatch is the only relevant safety concern.","The client no longer needs asepsis once stem cells are infused.","Low counts are expected before engraftment, but infection and bleeding risk are high and require strict precautions."],"correct":3,"topics":["Blood Transfusion/HSCT"],"paint":"Nursing Safety/Complications","priority":false,"teaching":false,"core":"During transplant-to-engraftment, counts remain low and infection/bleeding risks are high. Strict asepsis and possible blood-product support are course-supported.","notes":["Why not: RBC/WBC/platelet counts remain low between transplant and engraftment; recovery is not immediate.","Why not: the course separates HLA/tissue matching for HSCT from ABO blood-type matching.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Blood Transfusion/HSCT; it either addresses a different problem or would delay the needed response.","Best answer: During transplant-to-engraftment, counts remain low and infection/bleeding risks are high. Strict asepsis and possible blood-product support are course-supported."],"id":66},{"type":"mcq","stem":"Which action by a new nurse caring for a post-mastectomy client requires intervention?","choices":["Comparing radial pulses bilaterally.","Obtaining a blood pressure from the surgical-side arm.","Ambulating the client when alert, oriented, and stable.","Assessing the wound and JP drainage."],"correct":1,"topics":["Breast Cancer/Mastectomy","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"The course reinforces protecting the surgical/affected arm from BP and invasive procedures because of lymphedema/injury risk.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Breast Cancer/Mastectomy; it either addresses a different problem or would delay the needed response.","Best answer: The course reinforces protecting the surgical/affected arm from BP and invasive procedures because of lymphedema/injury risk.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Breast Cancer/Mastectomy; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Breast Cancer/Mastectomy; it either addresses a different problem or would delay the needed response."],"id":67},{"type":"mcq","stem":"A client with metastatic bone disease has constipation, polyuria, dehydration, weakness, and altered cognition. Which intervention should the nurse anticipate?","choices":["A thiazide diuretic as the preferred calcium-lowering measure.","Aggressive IV normal saline with close monitoring for fluid overload.","Bedrest solely to prevent a radiation-source dislodgement.","Strict fluid restriction as the first response."],"correct":1,"topics":["Oncologic Emergencies"],"paint":"Interventions/Take Action","priority":false,"teaching":false,"core":"The cue cluster fits hypercalcemia. Course treatment begins with aggressive IV normal saline; monitor closely for overload and avoid thiazides.","notes":["Why not: the hypercalcemia material says to avoid thiazides; IV normal saline and ordered calcium-lowering therapies are emphasized.","Best answer: The cue cluster fits hypercalcemia. Course treatment begins with aggressive IV normal saline; monitor closely for overload and avoid thiazides.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Why not: fluid restriction fits SIADH; TLS and hypercalcemia are course-linked to aggressive hydration rather than routine restriction."],"id":68},{"type":"case","stem":"A 54-year-old receiving doxorubicin has completed several cycles. Today the client reports new exertional dyspnea and ankle swelling. The most recent ejection fraction is meaningfully lower than baseline. Oral intake is adequate, the IV site is normal, and temperature is 98.6°F. Which action should the nurse take FIRST?","choices":["Encourage extra ambulation before discussing the ejection-fraction change.","Administer the chemotherapy because the IV site is intact.","Focus first on alopecia teaching and proceed with treatment.","Question/hold the planned treatment and notify the oncology provider about possible class-related cardiotoxicity."],"correct":3,"topics":["Chemotherapy Toxicities","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"KEY CLUE: new cardiopulmonary symptoms plus declining ejection fraction during an antitumor-antibiotic regimen. ANALYZE: the course emphasizes cumulative cardiac/pulmonary toxicity with this class. PRIORITY: prevent further treatment-related injury. TAKE ACTION: clarify/hold the treatment plan and escalate the abnormal cardiac finding. TRAP: an intact IV does not make the systemic toxicity safe to ignore.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy Toxicities; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy Toxicities; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy Toxicities; it either addresses a different problem or would delay the needed response.","Best answer: KEY CLUE: new cardiopulmonary symptoms plus declining ejection fraction during an antitumor-antibiotic regimen. ANALYZE: the course emphasizes cumulative cardiac/pulmonary toxicity with this class. PRIORITY: prevent further treatment-related injury. TAKE ACTION: clarify/hold the treatment plan and escalate the abnormal cardiac finding. TRAP: an intact IV does not make the systemic toxicity safe to ignore."],"id":69},{"type":"mcq","stem":"A client asks how donor selection for allogeneic HSCT differs from a routine blood transfusion. Which response is best?","choices":["HLA matching is used only for external radiation.","Only ABO matching matters for allogeneic HSCT.","Tissue/HLA matching is central for HSCT and is not the same as ABO matching.","Autologous transplant requires an unrelated donor."],"correct":2,"topics":["Blood Transfusion/HSCT","Patient Teaching"],"paint":"Teaching/Evaluation","priority":false,"teaching":true,"core":"The course emphasizes autologous, syngeneic, and allogeneic transplant types and that HLA/tissue matching is distinct from ABO blood-type matching.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Blood Transfusion/HSCT; it either addresses a different problem or would delay the needed response.","Why not: the course separates HLA/tissue matching for HSCT from ABO blood-type matching.","Best answer: The course emphasizes autologous, syngeneic, and allogeneic transplant types and that HLA/tissue matching is distinct from ABO blood-type matching.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Blood Transfusion/HSCT; it either addresses a different problem or would delay the needed response."],"id":70},{"type":"mcq","stem":"Which assessment finding can be misleading in a severely neutropenic client with infection?","choices":["Little redness, swelling, or purulent drainage despite serious infection.","A moist reddish-pink stoma.","A stable blood pressure.","A compressed JP reservoir."],"correct":0,"topics":["Neutropenia"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"Because the client cannot mount a normal inflammatory response, severe infection may occur without dramatic redness, swelling, pus, or high fever.","notes":["Best answer: Because the client cannot mount a normal inflammatory response, severe infection may occur without dramatic redness, swelling, pus, or high fever.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Neutropenia; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Neutropenia; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Neutropenia; it either addresses a different problem or would delay the needed response."],"id":71},{"type":"sata","stem":"While evaluating the client’s home-care plan, select the findings and teaching points that match the colorectal cancer/ostomy materials. SELECT ALL THAT APPLY.","choices":["Purple, black, or dry stoma tissue requires prompt intervention.","Keep peristomal skin clean and dry and monitor pouch leakage.","Scrub peristomal skin until it is red.","A black dry stoma is expected healing.","CEA alone is the definitive diagnosis of colorectal cancer.","A cool sitz bath is a course-supported comfort measure for rectal/perineal irritation."],"correct":[0,1,5],"exactCount":null,"topics":["Colorectal Cancer/Ostomy","Patient Teaching"],"paint":"Teaching/Evaluation","priority":false,"teaching":true,"core":"The correct selections are the course-supported statements for Colorectal Cancer/Ostomy. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario."],"id":72},{"type":"case","stem":"A client is Day 9 after cytotoxic chemotherapy. The client has painful oral ulcers, poor intake, temperature 100.4°F (38°C), mild tachycardia, and no purulent drainage. The client asks for mouthwash before the next chemotherapy dose. Which cue should change the nurse’s priority MOST?","choices":["The presence of alopecia.","The request for mouthwash.","The client’s preference for cold beverages.","The temperature of 100.4°F during the expected marrow nadir."],"correct":3,"topics":["Neutropenia","Priority/Clinical Judgment"],"paint":"Assessment/Recognize Cues","priority":true,"teaching":false,"core":"KEY CLUE: fever at the course threshold during the 7–10-day nadir window. ANALYZE: neutropenic infection can have few local signs, and severe mucositis can also be dose-limiting. PRIORITY: sepsis prevention outranks routine symptom teaching. TAKE ACTION: report/escalate and initiate infection evaluation. TRAP: mouth care matters, but it is not the first issue when neutropenic fever is present.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Neutropenia; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Neutropenia; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Neutropenia; it either addresses a different problem or would delay the needed response.","Best answer: KEY CLUE: fever at the course threshold during the 7–10-day nadir window. ANALYZE: neutropenic infection can have few local signs, and severe mucositis can also be dose-limiting. PRIORITY: sepsis prevention outranks routine symptom teaching. TAKE ACTION: report/escalate and initiate infection evaluation. TRAP: mouth care matters, but it is not the first issue when neutropenic fever is present."],"id":73},{"type":"mcq","stem":"A client with metastatic cancer reports worsening thoracic back pain, leg heaviness, tingling, and new urinary retention. What should the nurse do FIRST?","choices":["Escalate immediately for suspected spinal cord compression and anticipate MRI/high-dose IV corticosteroids.","Restrict sodium and fluids as the first intervention.","Encourage vigorous ambulation before notifying anyone.","Treat the pain as routine cancer discomfort and reassess next week."],"correct":0,"topics":["Oncologic Emergencies","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"Progressive back pain with neurologic and bowel/bladder changes suggests spinal cord compression. Urgent treatment is needed to prevent permanent neurologic loss.","notes":["Best answer: Progressive back pain with neurologic and bowel/bladder changes suggests spinal cord compression. Urgent treatment is needed to prevent permanent neurologic loss.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Why not: this delays care despite a course-identified urgent cue; the item requires earlier assessment/escalation or treatment."],"id":74},{"type":"mcq","stem":"A client has a fixed breast mass, nipple retraction, and peau d’orange. Which diagnostic step confirms malignancy?","choices":["A screening questionnaire only.","Mammography alone without tissue sampling.","Breast tissue biopsy with pathologic examination.","A normal CBC."],"correct":2,"topics":["Breast Cancer/Mastectomy"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"The cue cluster is highly suspicious for breast cancer, but tissue pathology is the definitive diagnostic method.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Breast Cancer/Mastectomy; it either addresses a different problem or would delay the needed response.","Why not: imaging may detect a suspicious lesion, but pathology of a tissue biopsy is definitive for malignancy.","Best answer: The cue cluster is highly suspicious for breast cancer, but tissue pathology is the definitive diagnostic method.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Breast Cancer/Mastectomy; it either addresses a different problem or would delay the needed response."],"id":75},{"type":"mcq","stem":"A client with breast cancer later has a lung lesion whose pathology shows breast-cancer cells. How should the nurse interpret this?","choices":["This automatically becomes a new primary lung cancer.","The lung lesion is benign because it is distant from the breast.","The finding only changes tumor grade, not stage.","This is metastatic breast cancer in the lung."],"correct":3,"topics":["Foundations/Cellular Regulation"],"paint":"Pathophysiology/Risk","priority":false,"teaching":false,"core":"A metastatic tumor keeps the identity of the primary tissue. Breast cancer that spreads to lung remains metastatic breast cancer.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Foundations/Cellular Regulation; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Foundations/Cellular Regulation; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Foundations/Cellular Regulation; it either addresses a different problem or would delay the needed response.","Best answer: A metastatic tumor keeps the identity of the primary tissue. Breast cancer that spreads to lung remains metastatic breast cancer."],"id":76},{"type":"sata","stem":"While preparing discharge teaching, a client is receiving chemotherapy and reports several common treatment effects. Select the appropriate nursing teaching and care. SELECT EXACTLY 4.","choices":["Direct sun exposure protects an alopecic scalp.","Use gentle saline/salt-and-soda mouth rinses and a soft toothbrush for mucositis.","Assist with ambulation and prevent falls when peripheral neuropathy occurs.","Contact oncology when nausea/vomiting prevents adequate intake.","Use alcohol mouthwash to disinfect mucositis ulcers.","Walk through dyspnea and palpitations to build endurance.","Offer

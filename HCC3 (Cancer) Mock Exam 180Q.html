iority":false,"teaching":true,"core":"The correct selections are the course-supported statements for Blood Transfusion/HSCT. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary."],"id":78},{"type":"mcq","stem":"An 11-year-old has WBC 56,000/mm³ with 92% blasts, hemoglobin 6.9 g/dL, platelets 29,000/µL, fever history, petechiae, and fatigue. Which interpretation is best?","choices":["The high WBC rules out infection risk.","The high WBC does not equal effective immunity because the cells are mostly immature blasts.","The platelet count eliminates bleeding risk.","The low hemoglobin has no relationship to fatigue or perfusion."],"correct":1,"topics":["ALL"],"paint":"Pathophysiology/Risk","priority":false,"teaching":false,"core":"ALL involves uncontrolled immature, nonfunctional blasts that crowd marrow and suppress normal RBC, WBC, and platelet production.","notes":["Why not: in ALL, a high WBC may consist largely of immature nonfunctional blasts, so infection risk can remain severe.","Best answer: ALL involves uncontrolled immature, nonfunctional blasts that crowd marrow and suppress normal RBC, WBC, and platelet production.","Why not: this option does not match the course-supported cue, timing, or nursing priority for ALL; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for ALL; it either addresses a different problem or would delay the needed response."],"id":79},{"type":"mcq","stem":"Which client statement about external-radiation skin care requires intervention?","choices":["“I will wear loose cotton clothing.”","“I will avoid heat, cold, tape, rubbing, and scratching.”","“I will use scented deodorant and lotion on the treatment site unless it burns.”","“I will protect the area from sunlight during treatment and for at least a year afterward.”"],"correct":2,"topics":["Radiation Safety/Skin Care","Priority/Clinical Judgment","Patient Teaching"],"paint":"Teaching/Evaluation","priority":true,"teaching":true,"core":"The handout says to avoid creams/lotions, deodorants, perfumes, sunscreen, soaps/powders unless specifically permitted; vitamin A&D ointment is the stated exception.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Radiation Safety/Skin Care; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Radiation Safety/Skin Care; it either addresses a different problem or would delay the needed response.","Best answer: The handout says to avoid creams/lotions, deodorants, perfumes, sunscreen, soaps/powders unless specifically permitted; vitamin A&D ointment is the stated exception.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Radiation Safety/Skin Care; it either addresses a different problem or would delay the needed response."],"id":80},{"type":"mcq","stem":"A client several hours after TURP develops headache, dizziness, shortness of breath, hypertension, bradycardia, and confusion. Which complication should the nurse suspect?","choices":["TURP syndrome.","External-radiation dermatitis.","Expected postoperative bladder spasm only.","Neutropenic nadir."],"correct":0,"topics":["TURP/CBI"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"The BPH/Prostate PAINT map lists headache/dizziness/SOB, hypertension, bradycardia, and altered level of consciousness as TURP-syndrome cues.","notes":["Best answer: The BPH/Prostate PAINT map lists headache/dizziness/SOB, hypertension, bradycardia, and altered level of consciousness as TURP-syndrome cues.","Why not: this option does not match the course-supported cue, timing, or nursing priority for TURP/CBI; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for TURP/CBI; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for TURP/CBI; it either addresses a different problem or would delay the needed response."],"id":81},{"type":"sata","stem":"During morning rounds, the nurse is reviewing chemotherapy safety and class toxicities. Select the statements that match the supplied course material. SELECT EXACTLY 4.","choices":["A burning swollen vesicant IV site is an expected finding that needs no action.","Hydration should be restricted before alkylating agents.","Oral chemotherapy may be handled freely with bare hands.","Profound neutropenia or severe mucositis can require treatment clarification/holding.","Chemotherapy schedules are designed to allow normal-cell recovery while maintaining cancer-cell kill.","Antimitotics can cause peripheral neuropathy and severe constipation.","Antitumor antibiotics require attention to cardiac/pulmonary toxicity and vesicant extravasation."],"correct":[3,4,5,6],"exactCount":4,"topics":["Chemotherapy","Chemotherapy Toxicities","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"The correct selections are the course-supported statements for Chemotherapy. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario."],"id":82},{"type":"matching","stem":"Match each chemotherapy class with the major toxicity/nursing priority emphasized in the HCC3 cancer materials.","left":["Antimetabolites","Antitumor antibiotics","Antimitotics / mitosis inhibitors","Alkylating agents","Topoisomerase inhibitors"],"right":["High neutropenia risk with diarrhea/mucositis → hydration and oral care","Cardiac/pulmonary toxicity and vesicant extravasation monitoring","Peripheral neuropathy and severe constipation","Aggressive hydration; renal-injury risk and severe nausea/vomiting","Significant diarrhea → hydration/antidiarrheals; atropine may be needed"],"mapping":[0,1,2,3,4],"topics":["Chemotherapy","Chemotherapy Toxicities"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"Match the class to the exact course-emphasized toxicity pattern: antimetabolites—neutropenia/mucositis/diarrhea; antitumor antibiotics—cardiac/pulmonary toxicity and vesicant injury; antimitotics—neuropathy/constipation; alkylating agents—hydration/renal/N&V; topoisomerase inhibitors—diarrhea.","id":83},{"type":"sata","stem":"While analyzing a new symptom cluster, select the cue-to-emergency or emergency-to-action connections supported by the HCC3 cancer materials. SELECT ALL THAT APPLY.","choices":["Progressive back pain with weakness/tingling/gait or bladder changes suggests spinal cord compression.","Thiazide diuretics are the preferred course treatment for hypercalcemia.","Constipation, polyuria, dehydration, weakness, and altered cognition suggest hypercalcemia.","New stridor in SVC syndrome is a routine nonurgent finding.","High-dose IV corticosteroids are a course-supported early treatment for spinal cord compression.","Spinal cord compression should be observed for several days before escalation."],"correct":[0,2,4],"exactCount":null,"topics":["Oncologic Emergencies"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"The correct selections are the course-supported statements for Oncologic Emergencies. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary."],"id":84},{"type":"mcq","stem":"A client with ALL has platelets 29,000/µL, petechiae, bruising, and bleeding gums. Which intervention is most appropriate?","choices":["Institute bleeding precautions and inspect skin, stool, urine, drainage, and emesis for blood.","Encourage aspirin for gum pain.","Perform unnecessary venipunctures to trend bleeding.","Use IM injections whenever possible."],"correct":0,"topics":["ALL"],"paint":"Interventions/Take Action","priority":false,"teaching":false,"core":"The ALL map makes bleeding prevention a priority: inspect for oozing/bruising/petechiae and blood in outputs while monitoring CBC/platelets.","notes":["Best answer: The ALL map makes bleeding prevention a priority: inspect for oozing/bruising/petechiae and blood in outputs while monitoring CBC/platelets.","Why not: aspirin is specifically avoided with thrombocytopenia/bleeding risk unless prescribed, and the ALL aspiration teaching uses aspirin-free analgesia.","Why not: this option does not match the course-supported cue, timing, or nursing priority for ALL; it either addresses a different problem or would delay the needed response.","Why not: unnecessary IM injections increase bleeding/injury risk and are avoided when platelets are suppressed."],"id":85},{"type":"mcq","stem":"A client receiving morphine for cancer pain is preparing for discharge. Which teaching is most important?","choices":["Use the prescribed bowel-management plan and report uncontrolled pain while monitoring for opioid effects.","Expect constipation but do not treat it.","Skip pain assessment once morphine begins.","Take aspirin routinely for opioid-related constipation."],"correct":0,"topics":["CINV/Symptom Management","Patient Teaching"],"paint":"Teaching/Evaluation","priority":false,"teaching":true,"core":"The cancer module connects opioids/morphine with pain and dyspnea palliation and emphasizes vital-sign monitoring and constipation prevention/management.","notes":["Best answer: The cancer module connects opioids/morphine with pain and dyspnea palliation and emphasizes vital-sign monitoring and constipation prevention/management.","Why not: this option does not match the course-supported cue, timing, or nursing priority for CINV/Symptom Management; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for CINV/Symptom Management; it either addresses a different problem or would delay the needed response.","Why not: aspirin is specifically avoided with thrombocytopenia/bleeding risk unless prescribed, and the ALL aspiration teaching uses aspirin-free analgesia."],"id":86},{"type":"mcq","stem":"A client with cancer has poor appetite, taste changes, and weight loss. Which intervention is most appropriate?","choices":["Require three large meals daily regardless of nausea.","Delay nutrition intervention until severe cachexia develops.","Offer small frequent high-calorie/high-protein meals and involve the dietitian while controlling symptoms.","Eliminate protein to reduce treatment effects."],"correct":2,"topics":["CINV/Symptom Management"],"paint":"Interventions/Take Action","priority":false,"teaching":false,"core":"Cancer nutrition care emphasizes small frequent high-calorie/high-protein meals/supplements, symptom control, preferences, and dietitian collaboration.","notes":["Why not: the course supports small, frequent high-calorie/high-protein intake when nausea, anorexia, or mucositis limits eating.","Why not: this delays care despite a course-identified urgent cue; the item requires earlier assessment/escalation or treatment.","Best answer: Cancer nutrition care emphasizes small frequent high-calorie/high-protein meals/supplements, symptom control, preferences, and dietitian collaboration.","Why not: this option does not match the course-supported cue, timing, or nursing priority for CINV/Symptom Management; it either addresses a different problem or would delay the needed response."],"id":87},{"type":"identify","stem":"A client shortly after treatment develops hyperkalemia, hyperuricemia, hyperphosphatemia, rising creatinine, flank pain, weakness, and confusion. Which emergency is most consistent?","choices":["SIADH","BPH","Tumor lysis syndrome","Hypercalcemia"],"correct":2,"topics":["Oncologic Emergencies","Priority/Clinical Judgment"],"paint":"Assessment/Recognize Cues","priority":true,"teaching":false,"core":"EVIDENCE: rapid-treatment timing + K/uric acid/phosphate elevation + renal/neuro cues. INTERPRETATION: massive tumor-cell breakdown has released intracellular contents faster than the body can eliminate them. CONDITION: tumor lysis syndrome.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response.","Best answer: EVIDENCE: rapid-treatment timing + K/uric acid/phosphate elevation + renal/neuro cues. INTERPRETATION: massive tumor-cell breakdown has released intracellular contents faster than the body can eliminate them. CONDITION: tumor lysis syndrome.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Oncologic Emergencies; it either addresses a different problem or would delay the needed response."],"id":88},{"type":"mcq","stem":"A client asks when marrow suppression is often greatest after cytotoxic therapy. Which course-based answer is best?","choices":["Only after external radiation, not chemotherapy.","Immediately before the first dose only.","Around 7–10 days after treatment, depending on the drug.","Exactly 30 days after every chemotherapy drug."],"correct":2,"topics":["Neutropenia"],"paint":"Pathophysiology/Risk","priority":false,"teaching":false,"core":"The course describes the nadir—the lowest marrow/WBC point—as commonly occurring about 7–10 days after cytotoxic therapy, although timing varies by drug.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Neutropenia; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Neutropenia; it either addresses a different problem or would delay the needed response.","Best answer: The course describes the nadir—the lowest marrow/WBC point—as commonly occurring about 7–10 days after cytotoxic therapy, although timing varies by drug.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Neutropenia; it either addresses a different problem or would delay the needed response."],"id":89},{"type":"mcq","stem":"A client with ALL has hemoglobin 6.9 g/dL, tachycardia, tachypnea, pallor, and fatigue. Which priority problem is most directly reflected?","choices":["Radiation-source contamination.","Healthy postoperative stoma function.","Impaired oxygen-carrying capacity/perfusion from severe anemia.","BPH-related urinary obstruction."],"correct":2,"topics":["ALL","Priority/Clinical Judgment"],"paint":"Assessment/Recognize Cues","priority":true,"teaching":false,"core":"Low hemoglobin/RBC production from marrow crowding can cause pallor, tachycardia, tachypnea, dyspnea, fatigue, and perfusion/oxygen-delivery concerns.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for ALL; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for ALL; it either addresses a different problem or would delay the needed response.","Best answer: Low hemoglobin/RBC production from marrow crowding can cause pallor, tachycardia, tachypnea, dyspnea, fatigue, and perfusion/oxygen-delivery concerns.","Why not: this option does not match the course-supported cue, timing, or nursing priority for ALL; it either addresses a different problem or would delay the needed response."],"id":90},{"type":"identify","stem":"A chemotherapy client has petechiae, enlarging bruises, oozing after venipuncture, and platelets 18,000/mm³. Which complication is most consistent?","choices":["Neutropenia","SIADH","External-radiation dermatitis","Severe thrombocytopenia"],"correct":3,"topics":["Thrombocytopenia","Priority/Clinical Judgment"],"paint":"Assessment/Recognize Cues","priority":true,"teaching":false,"core":"EVIDENCE: platelet count below 20,000 with bruising/petechiae/oozing. INTERPRETATION: the dominant problem is bleeding from severe platelet suppression. CONDITION: thrombocytopenia.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Thrombocytopenia; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Thrombocytopenia; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Thrombocytopenia; it either addresses a different problem or would delay the needed response.","Best answer: EVIDENCE: platelet count below 20,000 with bruising/petechiae/oozing. INTERPRETATION: the dominant problem is bleeding from severe platelet suppression. CONDITION: thrombocytopenia."],"id":91},{"type":"identify","stem":"A client has progressive change in bowel habits, ribbon-like stools, occult blood, anemia, abdominal fullness, and unintentional weight loss. Which condition best fits?","choices":["Lung cancer","Colorectal cancer","Breast cancer","BPH"],"correct":1,"topics":["Colorectal Cancer/Ostomy"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"EVIDENCE: stool-caliber/bowel-habit change + GI blood + anemia + weight loss. INTERPRETATION: the pattern indicates a bleeding/narrowing colorectal lesion. CONDITION: colorectal cancer.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Colorectal Cancer/Ostomy; it either addresses a different problem or would delay the needed response.","Best answer: EVIDENCE: stool-caliber/bowel-habit change + GI blood + anemia + weight loss. INTERPRETATION: the pattern indicates a bleeding/narrowing colorectal lesion. CONDITION: colorectal cancer.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Colorectal Cancer/Ostomy; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Colorectal Cancer/Ostomy; it either addresses a different problem or would delay the needed response."],"id":92},{"type":"bowtie","stem":"A client with lung cancer develops new upper-body findings. Choose the 2 MOST IMPORTANT cues, 1 most likely complication, and 2 PRIORITY nursing actions.","cues":["Facial/neck edema with distended upper-body veins","New stridor with dyspnea","Mild constipation","Hair loss","Platelets 140,000/mm³"],"correctCues":[0,1],"conditions":["Superior vena cava syndrome","Tumor lysis syndrome","SIADH without airway compromise","Mucositis"],"correctCondition":0,"actions":["Rapid airway/breathing escalation and elevate the head of bed","Notify the provider urgently and anticipate imaging/definitive relief such as stenting or cancer treatment","Place the client flat","Delay action until morning","Focus first on wig selection"],"correctActions":[0,1],"topics":["Oncologic Emergencies","Lung Cancer/Chest Tube","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"KEY CLUE: upper-body venous congestion plus stridor. ANALYZE: obstructed venous return is progressing to airway compromise. PRIORITY: airway/breathing. TAKE ACTION: rapid escalation, head elevation, and urgent provider-directed evaluation/treatment. TRAP: routine symptom teaching cannot outrank stridor.","id":93},{"type":"sata","stem":"During morning rounds, the nurse is caring for a client after lung surgery with a chest tube. Select the course-supported safety actions and red flags. SELECT ALL THAT APPLY.","choices":["Avoid routine stripping; the course map permits a hand-over-hand milking motion.","If the tube falls out of the chest, first cover the site with dry sterile gauze.","If the tube disconnects from the drainage system, first place the tube end in sterile water below chest level.","Ignore SpO₂ 88% if drainage is normal.","Clamp the chest tube whenever the client ambulates.","Raise the drainage system above the chest."],"correct":[0,1,2],"exactCount":null,"topics":["Lung Cancer/Chest Tube","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"The correct selections are the course-supported statements for Lung Cancer/Chest Tube. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary."],"id":94},{"type":"sata","stem":"While preparing discharge teaching, a client is losing weight during cancer treatment. Select the nutrition interventions actually supported by the supplied cancer files. SELECT ALL THAT APPLY.","choices":["Force three large meals despite severe nausea.","Ignore oral symptoms when addressing nutrition.","Follow client preferences and nutritional needs when planning meals.","Start parenteral nutrition automatically for every chemotherapy client.","Use dietitian collaboration for persistent intake/weight problems."],"correct":[2,4],"exactCount":null,"topics":["Nutrition/Parenteral Nutrition"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"The correct selections are the course-supported statements for Nutrition/Parenteral Nutrition. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario."],"id":95},{"type":"mcq","stem":"A client receiving irinotecan develops frequent watery stools. Which nursing action best matches the class toxicity?","choices":["Restrict fluids to prevent fluid overload in every case.","Treat the finding as a sign of thrombocytopenia.","Maintain hydration and administer prescribed antidiarrheal therapy; atropine may be used in some cases.","Start a bowel-stimulating regimen for constipation."],"correct":2,"topics":["Chemotherapy","Chemotherapy Toxicities"],"paint":"Interventions/Take Action","priority":false,"teaching":false,"core":"Topoisomerase inhibitors such as irinotecan/topotecan can cause significant diarrhea; hydration, antidiarrheals, and sometimes atropine are course-supported.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy; it either addresses a different problem or would delay the needed response.","Best answer: Topoisomerase inhibitors such as irinotecan/topotecan can cause significant diarrhea; hydration, antidiarrheals, and sometimes atropine are course-supported.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy; it either addresses a different problem or would delay the needed response."],"id":96},{"type":"mcq","stem":"A long-term smoker has a changing cough, hoarseness, hemoptysis, and progressive dyspnea. Which diagnostic pathway best fits the course?","choices":["PSA followed by DRE.","Chest x-ray/CT to define the lesion followed by tissue biopsy for confirmation.","CEA alone as the definitive test.","Bone marrow aspiration as the first definitive test for a solid lung lesion."],"correct":1,"topics":["Lung Cancer/Chest Tube"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"The lung-cancer materials use chest x-ray and CT to identify/define lesions, while tissue biopsy confirms malignancy; PET/MRI may assess spread.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Lung Cancer/Chest Tube; it either addresses a different problem or would delay the needed response.","Best answer: The lung-cancer materials use chest x-ray and CT to identify/define lesions, while tissue biopsy confirms malignancy; PET/MRI may assess spread.","Why not: CEA is mainly used to monitor colorectal disease/treatment/recurrence; it does not replace colonoscopy with tissue evaluation.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Lung Cancer/Chest Tube; it either addresses a different problem or would delay the needed response."],"id":97},{"type":"sata","stem":"During morning rounds, select the findings or interpretations that are supported by the course’s cellular-regulation material. SELECT EXACTLY 2.","choices":["M1 describes only regional lymph-node involvement.","A metastatic tumor is renamed for the distant organ it reaches.","Malignant cells may have loose adherence and migrate/metastasize.","Grade and stage mean the same thing.","Benign neoplasms are generally localized and do not metastasize."],"correct":[2,4],"exactCount":2,"topics":["Foundations/Cellular Regulation"],"paint":"Pathophysiology/Risk","priority":false,"teaching":false,"core":"The correct selections are the course-supported statements for Foundations/Cellular Regulation. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario."],"id":98},{"type":"sata","stem":"While reviewing the plan with a new oncology nurse, select the radiation-safety actions that are consistent with the exact HCC3 radiotherapy handout. SELECT EXACTLY 2.","choices":["Children under 16 may sit at the bedside without restriction.","Body fluids are never contaminated after unsealed radiation.","Use long-handled forceps and the lead container if a sealed source is dislodged.","Scrub off external-radiation markings after each treatment.","With an unsealed source, body fluids are contaminated, especially during the first 24–96 hours."],"correct":[2,4],"exactCount":2,"topics":["Radiation Therapy","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"The correct selections are the course-supported statements for Radiation Therapy. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario."],"id":99},{"type":"mcq","stem":"A client 2 days after colostomy creation has a stoma that is now purple, dry, and cooler than surrounding tissue. What should the nurse do?","choices":["Wait until the pouch is completely full before assessing again.","Document it as the expected healthy appearance.","Cover it with adhesive tape and reassess tomorrow.","Report the finding promptly because it suggests impaired perfusion/ischemia."],"correct":3,"topics":["Colorectal Cancer/Ostomy"],"paint":"Interventions/Take Action","priority":false,"teaching":false,"core":"A healthy stoma is moist and reddish-pink/dark red to pink. Purple/black/dry tissue is an urgent perfusion concern.","notes":["Why not: this delays care despite a course-identified urgent cue; the item requires earlier assessment/escalation or treatment.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Colorectal Cancer/Ostomy; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Colorectal Cancer/Ostomy; it either addresses a different problem or would delay the needed response.","Best answer: A healthy stoma is moist and reddish-pink/dark red to pink. Purple/black/dry tissue is an urgent perfusion concern."],"id":100},{"type":"mcq","stem":"A sealed brachytherapy source is found in the bed. Which action should the nurse take FIRST?","choices":["Carry it to the nurses’ station for identification.","Pick it up with gloved hands and return it to the client.","Place it in a regular sharps container.","Use long-handled forceps to place the source in the lead container kept in the room."],"correct":3,"topics":["Radiation Therapy","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"Never touch a dislodged sealed source with bare hands. The course specifies long-handled forceps and the lead container in the room.","notes":["Why not: a dislodged sealed source stays a radiation hazard; use long-handled forceps and the lead container in the room.","Why not: a dislodged sealed source stays a radiation hazard; use long-handled forceps and the lead container in the room.","Why not: a dislodged sealed source stays a radiation hazard; use long-handled forceps and the lead container in the room.","Best answer: Never touch a dislodged sealed source with bare hands. The course specifies long-handled forceps and the lead container in the room."],"id":101},{"type":"sata","stem":"During a change-of-shift review, select the findings and teaching points that match the colorectal cancer/ostomy materials. SELECT ALL THAT APPLY.","choices":["High-fiber intake, reduced red meat, exercise, and smoking/alcohol reduction are course-supported health promotion.","A sigmoid colostomy is expected to produce more solid stool when functioning.","Wait until the pouch is completely full before emptying.","CEA alone is the definitive diagnosis of colorectal cancer.","Purple, black, or dry stoma tissue requires prompt intervention.","Colonoscopy can visualize the bowel and obtain biopsy; CT colonography cannot biopsy.","A black dry stoma is expected healing."],"correct":[0,1,4,5],"exactCount":null,"topics":["Colorectal Cancer/Ostomy","Patient Teaching"],"paint":"Teaching/Evaluation","priority":false,"teaching":true,"core":"The correct selections are the course-supported statements for Colorectal Cancer/Ostomy. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary."],"id":102},{"type":"sata","stem":"While evaluating the client’s home-care plan, select the cue-to-emergency or emergency-to-action connections supported by the HCC3 cancer materials. SELECT ALL THAT APPLY.","choices":["High-dose IV corticosteroids are a course-supported early treatment for spinal cord compression.","TLS produces low potassium as its hallmark.","Neutropenic fever may be the only early clue to sepsis.","Constipation, polyuria, dehydration, weakness, and altered cognition suggest hypercalcemia.","Fever in neutropenia can be ignored without pus.","Hyponatremia with water retention and neurologic change suggests SIADH.","Fluid restriction is the priority for hypercalcemia."],"correct":[0,2,3,5],"exactCount":null,"topics":["Oncologic Emergencies"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"The correct selections are the course-supported statements for Oncologic Emergencies. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary."],"id":103},{"type":"mcq","stem":"A client with a large localized breast tumor receives chemotherapy before planned surgery. Which term best describes this sequence?","choices":["A screening intervention.","Adjuvant therapy.","Palliative-only therapy.","Neoadjuvant therapy."],"correct":3,"topics":["Common Cancer Management"],"paint":"Pathophysiology/Risk","priority":false,"teaching":false,"core":"Neoadjuvant therapy is given before local treatment such as surgery or radiation to reduce tumor burden.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Common Cancer Management; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Common Cancer Management; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Common Cancer Management; it either addresses a different problem or would delay the needed response.","Best answer: Neoadjuvant therapy is given before local treatment such as surgery or radiation to reduce tumor burden."],"id":104},{"type":"mcq","stem":"A client has occult blood, anemia, ribbon-like stools, and weight loss. Which test both visualizes the entire large bowel and allows biopsy/removal of suspicious tissue?","choices":["Colonoscopy.","CEA level alone.","CT colonography alone.","FOBT alone."],"correct":0,"topics":["Colorectal Cancer/Ostomy"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"Colonoscopy is the course’s definitive colorectal test because it allows full visualization plus tissue sampling/removal; CEA is mainly for monitoring, and virtual CT cannot biopsy.","notes":["Best answer: Colonoscopy is the course’s definitive colorectal test because it allows full visualization plus tissue sampling/removal; CEA is mainly for monitoring, and virtual CT cannot biopsy.","Why not: CEA is mainly used to monitor colorectal disease/treatment/recurrence; it does not replace colonoscopy with tissue evaluation.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Colorectal Cancer/Ostomy; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Colorectal Cancer/Ostomy; it either addresses a different problem or would delay the needed response."],"id":105},{"type":"mcq","stem":"A client is learning home JP care after mastectomy. Which action shows correct technique?","choices":["Leave the reservoir expanded so suction stops.","Empty, measure, and record drainage and keep the reservoir compressed/closed as designed.","Use the surgical-side arm for venipuncture to keep the other arm free.","Ignore increasing purulent drainage."],"correct":1,"topics":["Breast Cancer/Mastectomy","Patient Teaching"],"paint":"Teaching/Evaluation","priority":false,"teaching":true,"core":"JP teaching includes maintaining compression, emptying the reservoir, measuring/recording output, and reporting excessive or infection-type drainage.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Breast Cancer/Mastectomy; it either addresses a different problem or would delay the needed response.","Best answer: JP teaching includes maintaining compression, emptying the reservoir, measuring/recording output, and reporting excessive or infection-type drainage.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Breast Cancer/Mastectomy; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Breast Cancer/Mastectomy; it either addresses a different problem or would delay the needed response."],"id":106},{"type":"mcq","stem":"A client becomes tearful after learning that treatment will alter appearance and sexuality. Which nursing response is most appropriate?","choices":["Assume family members will address all emotional needs.","Assess coping concerns and offer supportive resources while continuing physiologic care.","Tell the client these concerns are secondary and should wait until discharge.","Avoid discussing body image unless the client stops treatment."],"correct":1,"topics":["Common Cancer Management"],"paint":"Interventions/Take Action","priority":false,"teaching":false,"core":"Psychosocial support, body image, sexuality, coping, family dynamics, and access to resources are common cancer-care priorities.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Common Cancer Management; it either addresses a different problem or would delay the needed response.","Best answer: Psychosocial support, body image, sexuality, coping, family dynamics, and access to resources are common cancer-care priorities.","Why not: this delays care despite a course-identified urgent cue; the item requires earlier assessment/escalation or treatment.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Common Cancer Management; it either addresses a different problem or would delay the needed response."],"id":107},{"type":"sata","stem":"During morning rounds, select the radiation-safety actions that are consistent with the exact HCC3 radiotherapy handout. SELECT EXACTLY 2.","choices":["Use lukewarm water and avoid rubbing, scratching, or scrubbing the irradiated site.","Avoid heat, cold, tape, and course-restricted creams/lotions/deodorants/perfumes/sunscreen on the site.","Turn the back of the lead apron toward the radiation source.","Scrub off external-radiation markings after each treatment.","Body fluids are never contaminated after unsealed radiation."],"correct":[0,1],"exactCount":2,"topics":["Radiation Therapy","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"The correct selections are the course-supported statements for Radiation Therapy. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary."],"id":108},{"type":"case","stem":"A client is 4 hours after lobectomy for lung cancer. The chest tube had been draining steadily. The client suddenly becomes dyspneic, SpO₂ falls to 88%, and the trachea appears deviated. Chest-tube drainage has abruptly stopped. Which nursing action is the priority?","choices":["Record the drainage amount and reassess in one hour.","Begin routine smoking-cessation teaching.","Immediately assess and support breathing while checking the chest-tube system for an acute complication and rapidly escalating.","Clamp the chest tube and leave it clamped while calling family."],"correct":2,"topics":["Lung Cancer/Chest Tube","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"KEY CLUE: sudden dyspnea, SpO₂ <90%, tracheal deviation, and abrupt early drainage cessation. ANALYZE: the course identifies each as a red flag after thoracic surgery. PRIORITY: airway/breathing and device safety. TAKE ACTION: immediate respiratory/device assessment and rapid escalation. TRAP: documentation is important but cannot precede response to acute deterioration.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Lung Cancer/Chest Tube; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Lung Cancer/Chest Tube; it either addresses a different problem or would delay the needed response.","Best answer: KEY CLUE: sudden dyspnea, SpO₂ <90%, tracheal deviation, and abrupt early drainage cessation. ANALYZE: the course identifies each as a red flag after thoracic surgery. PRIORITY: airway/breathing and device safety. TAKE ACTION: immediate respiratory/device assessment and rapid escalation. TRAP: documentation is important but cannot precede response to acute deterioration.","Why not: routine/prolonged chest-tube clamping is not supported; the course limits clamping to brief, specific situations."],"id":109},{"type":"case","stem":"A client 2 days after colorectal surgery has a new colostomy. At 0800 the stoma was moist and reddish-pink. At 1200 it is dusky purple, dry, and has very little output. The client also reports increasing abdominal discomfort. Which action should the nurse take FIRST?","choices":["Document the change as expected postoperative maturation.","Wait until the pouch is completely full before reassessing.","Report the change promptly as possible stoma ischemia/perfusion compromise.","Apply a heating pad over the stoma to improve blood flow."],"correct":2,"topics":["Colorectal Cancer/Ostomy","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"KEY CLUE: a previously healthy moist pink stoma has become purple and dry. ANALYZE: this is a perfusion change, not normal edema. PRIORITY: preserve tissue viability and identify ischemia early. TAKE ACTION: prompt escalation. TRAP: waiting for output or using heat delays care and conflicts with the course.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Colorectal Cancer/Ostomy; it either addresses a different problem or would delay the needed response.","Why not: this delays care despite a course-identified urgent cue; the item requires earlier assessment/escalation or treatment.","Best answer: KEY CLUE: a previously healthy moist pink stoma has become purple and dry. ANALYZE: this is a perfusion change, not normal edema. PRIORITY: preserve tissue viability and identify ischemia early. TAKE ACTION: prompt escalation. TRAP: waiting for output or using heat delays care and conflicts with the course.","Why not: the radiotherapy handout specifically prohibits heating devices/temperature extremes on the irradiated site."],"id":110},{"type":"sata","stem":"Before the next treatment cycle, select the cue-to-emergency or emergency-to-action connections supported by the HCC3 cancer materials. SELECT ALL THAT APPLY.","choices":["Constipation, polyuria, dehydration, weakness, and altered cognition suggest hypercalcemia.","Neutropenic fever may be the only early clue to sepsis.","Fever in neutropenia can be ignored without pus.","New stridor in SVC syndrome is a routine nonurgent finding.","Fluid restriction is the priority for hypercalcemia."],"correct":[0,1],"exactCount":null,"topics":["Oncologic Emergencies"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"The correct selections are the course-supported statements for Oncologic Emergencies. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary."],"id":111},{"type":"bowtie","stem":"During a vesicant chemotherapy infusion, the nurse notes a new IV-site problem. Choose the 2 MOST IMPORTANT cues, 1 most likely complication, and 2 PRIORITY nursing actions.","cues":["Burning pain and swelling at the infusion site","Leakage/loss of reliable blood return","Mild nausea","Stable blood pressure","Alopecia"],"correctCues":[0,1],"conditions":["Vesicant extravasation","Expected chemotherapy effect","Neutropenic sepsis","SIADH"],"correctCondition":0,"actions":["Stop/activate the institution’s drug-specific extravasation management process immediately","Coordinate promptly with oncology/pharmacy for the drug-specific antidote and management","Massage the site vigorously","Increase the infusion rate","Wait until the infusion is complete"],"correctActions":[0,1],"topics":["Chemotherapy","Chemotherapy Toxicities","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"KEY CLUE: local pain/swelling/leakage during a vesicant infusion. ANALYZE: tissue exposure can cause severe injury. PRIORITY: prevent further tissue damage. TAKE ACTION: immediately activate the drug-specific extravasation process and coordinate antidote/management. TRAP: continuing or massaging can worsen injury.","id":112},{"type":"mcq","stem":"A chest tube is accidentally pulled out of the client’s chest. What is the course-supported FIRST action?","choices":["Place the removed tube back into the chest.","Cover the insertion site with dry sterile gauze and rapidly escalate.","Clamp the client’s remaining chest tubes indefinitely.","Put the external drainage tubing into sterile water before covering the site."],"correct":1,"topics":["Lung Cancer/Chest Tube","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"The course specifically differentiates tube-out from disconnection: if the tube falls out of the chest, first cover the site with dry sterile gauze.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Lung Cancer/Chest Tube; it either addresses a different problem or would delay the needed response.","Best answer: The course specifically differentiates tube-out from disconnection: if the tube falls out of the chest, first cover the site with dry sterile gauze.","Why not: routine/prolonged chest-tube clamping is not supported; the course limits clamping to brief, specific situations.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Lung Cancer/Chest Tube; it either addresses a different problem or would delay the needed response."],"id":113},{"type":"sata","stem":"While analyzing a new symptom cluster, the nurse is reviewing chemotherapy safety and class toxicities. Select the statements that match the supplied course material. SELECT EXACTLY 3.","choices":["Combination chemotherapy can increase cancer-cell kill but can also increase toxicity.","Oral chemotherapy may be handled freely with bare hands.","Peripheral neuropathy is unrelated to antimitotics.","Antimitotics can cause peripheral neuropathy and severe constipation.","A burning swollen vesicant IV site is an expected finding that needs no action.","Antimetabolites are associated with neutropenia, diarrhea, and mucositis."],"correct":[0,3,5],"exactCount":3,"topics":["Chemotherapy","Chemotherapy Toxicities","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"The correct selections are the course-supported statements for Chemotherapy. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario."],"id":114},{"type":"identify","stem":"During doxorubicin infusion, a client develops burning pain, swelling, and leakage at the IV site with loss of reliable blood return. Which complication is most consistent?","choices":["Thrombocytopenia","Vesicant extravasation","Expected CINV","Radiation dermatitis"],"correct":1,"topics":["Chemotherapy Toxicities","Priority/Clinical Judgment"],"paint":"Assessment/Recognize Cues","priority":true,"teaching":false,"core":"EVIDENCE: vesicant infusion + localized burning/swelling/leakage and access change. INTERPRETATION: medication has likely escaped into tissue and can cause severe injury. CONDITION: chemotherapy extravasation.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy Toxicities; it either addresses a different problem or would delay the needed response.","Best answer: EVIDENCE: vesicant infusion + localized burning/swelling/leakage and access change. INTERPRETATION: medication has likely escaped into tissue and can cause severe injury. CONDITION: chemotherapy extravasation.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy Toxicities; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy Toxicities; it either addresses a different problem or would delay the needed response."],"id":115},{"type":"case","stem":"A client receives continuous bladder irrigation after TURP. Over 8 hours, 3,300 mL of normal saline was infused and the drainage bag contains 3,450 mL. The client now reports severe bladder spasms. Which interpretation and action are best?","choices":["True urine output is 3,450 mL; decrease monitoring because output is excellent.","True urine output is 3,300 mL; stop CBI permanently.","True urine output is 150 mL total (18.75 mL/hr); assess for kinks/clots and restore catheter patency per protocol.","True urine output is 6,750 mL; the spasms are expected and need no assessment."],"correct":2,"topics":["TURP/CBI","Priority/Clinical Judgment"],"paint":"Interventions/Take Action","priority":true,"teaching":false,"core":"KEY CLUE: drainage includes irrigant. ANALYZE: 3,450 − 3,300 = 150 mL actual urine in 8 hours, or 18.75 mL/hr, plus severe spasms. PRIORITY: suspected obstruction/patency problem. TAKE ACTION: check kinks/clots, irrigate per protocol, and notify if unresolved. TRAP: using total bag volume as urine output hides low true output.","notes":["Why not: CBI drainage includes irrigant. True urine output must be calculated by subtracting the infused irrigant from total drainage.","Why not: CBI drainage includes irrigant. True urine output must be calculated by subtracting the infused irrigant from total drainage.","Best answer: KEY CLUE: drainage includes irrigant. ANALYZE: 3,450 − 3,300 = 150 mL actual urine in 8 hours, or 18.75 mL/hr, plus severe spasms. PRIORITY: suspected obstruction/patency problem. TAKE ACTION: check kinks/clots, irrigate per protocol, and notify if unresolved. TRAP: using total bag volume as urine output hides low true output.","Why not: CBI drainage includes irrigant. True urine output must be calculated by subtracting the infused irrigant from total drainage."],"id":116},{"type":"mcq","stem":"A pathology report describes a solid tumor as poorly differentiated with marked anaplasia. Which interpretation should the nurse make?","choices":["The report describes the extent of distant spread rather than grade.","Poor differentiation means the tumor is encapsulated.","The tumor is benign because differentiation is poor.","The cells resemble the parent tissue less and the tumor is higher grade."],"correct":3,"topics":["Foundations/Cellular Regulation"],"paint":"Pathophysiology/Risk","priority":false,"teaching":false,"core":"Grading reflects differentiation. Poorly differentiated/anaplastic cells look less like the tissue of origin and represent a higher grade; staging, not grading, describes extent/spread.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority for Foundations/Cellular Regulation; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Foundations/Cellular Regulation; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Foundations/Cellular Regulation; it either addresses a different problem or would delay the needed response.","Best answer: Grading reflects differentiation. Poorly differentiated/anaplastic cells look less like the tissue of origin and represent a higher grade; staging, not grading, describes extent/spread."],"id":117},{"type":"mcq","stem":"A screening mammogram identifies a suspicious breast lesion. Which next finding would definitively establish whether the solid tumor is malignant?","choices":["Pathologic examination of a tissue biopsy.","An elevated CBC white blood cell count.","A family history of breast cancer.","A repeat screening mammogram alone."],"correct":0,"topics":["Foundations/Cellular Regulation"],"paint":"Assessment/Recognize Cues","priority":false,"teaching":false,"core":"The course identifies pathology of sampled tissue as the definitive method for determining whether a solid tumor is benign or malignant.","notes":["Best answer: The course identifies pathology of sampled tissue as the definitive method for determining whether a solid tumor is benign or malignant.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Foundations/Cellular Regulation; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Foundations/Cellular Regulation; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Foundations/Cellular Regulation; it either addresses a different problem or would delay the needed response."],"id":118},{"type":"mcq","stem":"Which statement by a client taking oral chemotherapy indicates a need for further teaching?","choices":["“I will contact the oncology team about serious side effects.”","“I will follow the prescribed schedule closely.”","“I will treat the medication as hazardous.”","“Because it is a pill, my family can handle it with bare hands.”"],"correct":3,"topics":["Chemotherapy","Chemotherapy Toxicities","Patient Teaching"],"paint":"Teaching/Evaluation","priority":false,"teaching":true,"core":"Oral chemotherapy remains hazardous to the patient and handlers; adherence and safe handling are priorities.","notes":["Why not: the course separates HLA/tissue matching for HSCT from ABO blood-type matching.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy; it either addresses a different problem or would delay the needed response.","Why not: this option does not match the course-supported cue, timing, or nursing priority for Chemotherapy; it either addresses a different problem or would delay the needed response.","Best answer: Oral chemotherapy remains hazardous to the patient and handlers; adherence and safe handling are priorities."],"id":119},{"type":"sata","stem":"During a change-of-shift review, the nurse is reviewing chemotherapy safety and class toxicities. Select the statements that match the supplied course material. SELECT EXACTLY 2.","choices":["Hydration should be restricted before alkylating agents.","Antitumor antibiotics require attention to cardiac/pulmonary toxicity and vesicant extravasation.","All chemotherapy classes have identical toxicities.","A burning swollen vesicant IV site is an expected finding that needs no action.","Antimitotics can cause peripheral neuropathy and severe constipation."],"correct":[1,4],"exactCount":2,"topics":["Chemotherapy","Chemotherapy Toxicities","Priority/Clinical Judgment"],"paint":"Nursing Safety/Complications","priority":true,"teaching":false,"core":"The correct selections are the course-supported statements for Chemotherapy. Distractors deliberately represent actions or interpretations that conflict with the professor/course materials.","notes":["Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Do not select: this statement conflicts with the supplied course precautions, timing, expected findings, or source boundary.","Correct selection: this statement directly matches the supplied HCC3 cancer/PAINT/course material for this scenario."],"id":120},{"type":"mcq","stem":"A client is scheduled for both PSA testing and a DRE. Which sequence is emphasized in the course?","choices":["Perform the DRE first because manipulation lowers PSA.","Cancel the PSA because it is diagnostic for BPH only.","Draw the PSA before the DRE.","Either order is preferred because DRE never affects PSA."],"correct":2,"topics":["BPH/Prostate Cancer"],"paint":"Nursing Safety/Complications","priority":false,"teaching":false,"core":"The professor/course materials emphasize obtaining PSA before DRE because manipulation may raise the PSA.","notes":["Why not: the course emphasizes drawing PSA before DRE because prostate manipulation can raise PSA.","Why not: this option does not match the course-supported cue, timing, or nursing priority for BPH/Prostate Cancer; it either addresses a different problem or would delay the needed response.","Best answer: The professor/course materials emphasize obtaining PSA before DRE because manipulation may raise the PSA.","Why not: this option does not match the course-supported cue, timing, or nursing priority for BPH/Prostate Cancer; it either addresses a different problem or would delay the needed response."],"id":121},{"type":"mcq","stem":"A client receiving multimodal cancer therapy reports pain, poor intake, fatigue, and fear about body changes. Which nursing plan best reflects common cancer management?","choices":["Focus only on tumor size because psychosocial concerns are unrelated to outcomes.","Use one identical nursing plan for all cancer types regardless of treatment.","Address physiologic safety, symptom control, nutrition, coping, and teaching together.","Delay symptom management until antineoplastic therapy is complete."],"correct":2,"topics":["Common Cancer Management"],"paint":"Interventions/Take Action","priority":false,"teaching":false,"core":"Course materials frame cancer care as multimodal and person-centered: protect physiologic function while treating symptoms, nutrition, coping, and education.","notes":["Why not: this option does not match the course-supported cue, timing, or nursing priority f
